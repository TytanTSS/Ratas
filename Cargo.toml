[workspace]
resolver = "2"
members = ["crates/core", "crates/ratas"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
# drawing and generation code passes many plain numbers around
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
should_implement_trait = "allow"
# texts are built from translated pieces on purpose
format_in_format_args = "allow"
if_same_then_else = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
