"Тесак Кровавой Орды" = "Cleaver of the Blood Horde"
"Им вождь орков рубил головы вождям поменьше." = "The orc warlord cut off the heads of lesser warlords with it."
"Жало Королевы" = "Queen's Sting"
"Яд королевы" = "Queen's Venom"
"Яд на нём не высыхает никогда." = "The poison on it never dries."
"Филактерия Морвен" = "Morwen's Phylactery"
"В склянке бьётся то, что осталось от души лича." = "What is left of the lich's soul beats inside the vial."
"Шлем Ледоборода" = "Frostbeard's Helm"
"Иней на рогах не тает даже у кузнечного горна." = "The frost on its horns does not melt even at a forge."
"Сердце Магмы" = "Heart of Magma"
"Перстень тёплый, как живое сердце, и так же стучит." = "The ring is warm like a living heart, and beats like one."
"Немес Анх-Тамуна" = "Nemes of Ankh-Tamun"
"Золото фараона. Песок в складках пахнет вечностью." = "The pharaoh's gold. The sand in its folds smells of eternity."
"Клинок Бездны" = "Abyssal Edge"
"Меч Азгарота. Лезвие пьёт свет вокруг себя." = "Azgaroth's sword. The blade drinks the light around it."
"Копьё Рассветного стража" = "Dawnguard Spear"
"Древко длиннее любого копья: им достают врага через клетку." = "A shaft longer than any spear: it reaches an enemy two tiles away."
"Посох Первого Грома" = "Staff of the First Thunder"
"Говорят, в него ударила самая первая молния мира." = "They say the very first lightning of the world struck it."
"Молот Горной Наковальни" = "Mountain Anvil Hammer"
"Оглушение" = "Stun"
"Им ковали горы, пока горы были мягкими." = "Mountains were forged with it while they were still soft."
"Кираса Рассвета" = "Cuirass of Dawn"
"Её полировали солнечным светом сто лет." = "It was polished with sunlight for a hundred years."
"Сапоги Странника" = "Wanderer's Boots"
"Им всё равно, куда идти. Лишь бы идти." = "They do not care where to go. As long as they go."
"Кольцо Семи Ветров" = "Ring of the Seven Winds"
"Внутри кольца свистит ветер." = "Wind whistles inside the ring."
"В кармашках позвякивают пустые склянки." = "Empty vials clink in its pockets."
"Плащ Пепла" = "Mantle of Ash"
"Края плаща тлеют, но не сгорают." = "The edges of the mantle smoulder but never burn."
"Маска Тысячи Лиц" = "Mask of a Thousand Faces"
"Каждый раз, когда её снимаешь, под ней чужое лицо." = "Every time you take it off, there is someone else's face under it."
"Арбалет Ловчего" = "Hunter's Crossbow"
"Болты сами находят щель в доспехе." = "Its bolts find the gap in armor by themselves."
