# classes, subclasses, branches
"Друид" = "Druid"
"Секретный класс. Сила леса: корни, яд, исцеление и звериные облики. Подклассы: Хранитель рощи, Оборотень." = "Secret class. The power of the forest: roots, poison, healing and beast forms. Subclasses: Grove Keeper, Shapeshifter."
"Секретный класс. Поднимает мёртвых, повелевает холодом и мором. Подклассы: Повелитель костей, Чумной мор." = "Secret class. Raises the dead and commands cold and plague. Subclasses: Bonelord, Plaguebringer."
"Хранитель рощи" = "Grove Keeper"
"Лечит союзников, призывает древня и обрушивает на врагов гнев природы." = "Heals allies, summons a treant and brings the wrath of nature down on enemies."
"Оборотень" = "Shapeshifter"
"Принимает облик медведя или волка и рвёт врагов в ближнем бою." = "Takes the form of a bear or a wolf and tears enemies apart in melee."
"Повелитель костей" = "Bonelord"
"Армия скелетов, костяной доспех и костяной колосс." = "An army of skeletons, bone armor and a bone colossus."
"Чумной мор" = "Plaguebringer"
"Ядовитые облака и зараза, перескакивающая с врага на врага." = "Poison clouds and a contagion leaping from enemy to enemy."
"Берсерк" = "Berserker"
"Ярость без страха: чем ближе смерть, тем сильнее удары. Вихрь клинков и бешенство, которое не даёт упасть." = "Fearless fury: the closer death is, the harder the blows. A whirl of blades and a frenzy that will not let you fall."
"Охотник на чудищ" = "Monster Hunter"
"Метки, серебряные бомбы и казнь: смертелен для чудовищ и боссов." = "Marks, silver bombs and executions: deadly to monsters and bosses."
"Хрономант" = "Chronomancer"
"Ускоряет союзников, замедляет и останавливает врагов, отматывает раны назад." = "Hastens allies, slows and stops enemies, rewinds wounds."
