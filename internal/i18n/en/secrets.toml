"Очищающее пламя: урон светом и огнём разом, приговор нечисти и костёр вокруг." = "Purging flame: holy and fire damage at once, a verdict for the unclean and a pyre around."
"Корни, шипы и дыхание леса." = "Roots, thorns and the breath of the forest."
