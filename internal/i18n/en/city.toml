# Big cities: tiles, citizens (content/data/citizens.toml) and game/city.go
"Мостовая" = "Cobblestone"
"Городские ворота" = "City gate"
"Фонарь" = "Street lamp"
"Прилавок" = "Market stall"
"Клумба" = "Flower bed"
"Крепостная стена" = "City wall"
"Фонтан" = "Fountain"
"Статуя" = "Statue"

"Отличный выбор! Такой вещи больше ни у кого нет." = "Excellent choice! Nobody else has a thing like that."
"Снять комнату и поужинать (%d золота)" = "Take a room and have supper (%d gold)"
"Улучшить оружие в руке (%d золота)" = "Improve the weapon in hand (%d gold)"
"Спой мне песню (%d золота)" = "Sing me a song (%d gold)"
"Благослови меня (%d золота)" = "Bless me (%d gold)"
"Отдых" = "Rested"
"Вдохновение" = "Inspiration"
"Благословение" = "Blessing"
"Комната стоит денег, друг. Приходи, когда разбогатеешь." = "A room costs money, friend. Come back when you are richer."
"Выспался? Вот и славно. Дорога ждёт." = "Slept well? Good. The road awaits."
"Мягкая постель, горячий ужин — и ты как новенький!" = "A soft bed, a hot supper — and you are as good as new!"
"Ужин за счёт заведения. Шучу — уже оплачен." = "Supper is on the house. Just kidding — it's already paid for."
"С этим я ничего не сделаю." = "I can't do anything with that."
"Работа тонкая — %d золота, не меньше." = "It's delicate work — %d gold, no less."
"Улучшено: %s (%s)." = "Improved: %s (%s)."
"Держи. Перековал, заточил, закалил — теперь это %s клинок, не хуже королевского." = "Here. Reforged, sharpened, tempered — now it's a %s blade, as good as a king's."
"Песня стоит монету, а у тебя и той нет. Ладно, напою бесплатно: ля-ля-ля." = "A song costs a coin, and you don't even have that. Fine, a free one: la-la-la."
"Ла-ла! О герое по имени %s сложат песни!" = "La-la! Songs will be sung of the hero named %s!"
"Пусть мелодия ведёт твой клинок!" = "Let the melody guide your blade!"
"Песня о храбреце, что не знал страха. Узнаёшь?" = "A song of a brave one who knew no fear. Recognize them?"
"Эта баллада — о тебе! Иди и сделай её правдой." = "This ballad is about you! Go and make it true."
"Свет не торгует, но храм нуждается в пожертвованиях." = "The Light does not trade, but the temple needs donations."
"Да хранит тебя Свет от тьмы и от дурной стали." = "May the Light keep you from darkness and from bad steel."

# citizens
"Бургомистр" = "Mayor"
"Добро пожаловать в {village}! Город рад героям — особенно тем, что платят пошлину." = "Welcome to {village}! The city is glad to see heroes — especially those who pay the toll."
"А, {player}! Наслышан, наслышан. Присаживайтесь." = "Ah, {player}! I have heard so much. Please, sit down."
"Говорите кратко — у меня совет гильдий через час." = "Be brief — I have a guild council in an hour."
"Казна не бездонная, а стены сами себя не чинят." = "The treasury is not bottomless, and the walls don't mend themselves."
"Торговые пути — кровь города. Чудища на дорогах — его болезнь." = "Trade routes are the city's blood. Monsters on the roads are its disease."
"Важный, но деятельный бургомистр большого каменного города. Говорит учтиво и немного напыщенно, думает о казне, торговле и безопасности дорог, щедро платит за избавление от чудищ." = "The self-important but busy mayor of a big stone city. Speaks politely and a little pompously, thinks about the treasury, trade and safe roads, pays generously for ridding them of monsters."
"Мой дед торговал рыбой на этой самой площади. А я теперь заседаю над ней. Вот что значит упорство." = "My grandfather sold fish on this very square. And now I preside over it. That's what persistence means."
"Эти стены строили сорок лет. Ни один враг не взял их приступом. Пока." = "These walls took forty years to build. No enemy has ever stormed them. Yet."
"Город — это договор тысячи людей не убивать друг друга. Удивительно, как хорошо он работает." = "A city is a pact of a thousand people not to kill each other. It's amazing how well it works."
"Капитан стражи" = "Captain of the Guard"
"Смирно! А, ты не из моих. Чего надо?" = "Attention! Ah, you're not one of mine. What do you want?"
"Если ты по делу — говори. Если нет — не мешай службе." = "If it's business — speak. If not — don't get in the way of duty."
"Пятеро на воротах, двое на площади, и всё равно мало." = "Five on the gates, two on the square, and still not enough."
"Кто хочет заработать — бей чудищ у дорог." = "Want to earn some coin? Kill the monsters by the roads."
"Суровый капитан городской стражи, ветеран многих битв. Говорит по-военному чётко, уважает дисциплину и смелость, платит за головы чудищ." = "The stern captain of the city guard, a veteran of many battles. Speaks with military precision, respects discipline and courage, pays for monsters' heads."
"Тридцать лет в строю. Шрамов больше, чем медалей, и это правильно." = "Thirty years in the ranks. More scars than medals, and that's how it should be."
"Я начинал простым копейщиком на этих воротах. Теперь отвечаю за все четыре." = "I started as a simple spearman on these gates. Now I answer for all four."
"Лучший стражник — тот, кто не спит на посту. Таких у меня трое." = "The best guard is the one who doesn't sleep on watch. I have three of those."
"Трактирщик" = "Innkeeper"
"Заходи, путник! Эль холодный, похлёбка горячая, комнаты чистые." = "Come in, traveller! The ale is cold, the stew is hot, the rooms are clean."
"О, {player}! Твой столик у окна свободен." = "Oh, {player}! Your table by the window is free."
"Садись, рассказывай — у меня тут все новости города." = "Sit down, tell me everything — all the city's news ends up here."
"Кто платит — тот и поёт. Кто не платит — тот моет посуду." = "Who pays gets to sing. Who doesn't pay washes the dishes."
"Слухи у меня бесплатно. Эль — нет." = "Rumors are free here. Ale is not."
"Радушный и болтливый трактирщик. Знает все слухи города и окрестностей, любит байки, хорошую еду и щедрых гостей." = "A hearty and talkative innkeeper. Knows every rumor of the city and its surroundings, loves tall tales, good food and generous guests."
"Этот трактир достался мне от тёщи. Вместе с тёщей." = "I inherited this tavern from my mother-in-law. Together with my mother-in-law."
"Однажды здесь подрались гном и великан. Гном победил. До сих пор не понимаю как." = "Once a dwarf and a giant fought here. The dwarf won. I still don't understand how."
"Лучший эль варят из северного ячменя. Я варю из местного. Никто не жаловался. Почти." = "The best ale is brewed from northern barley. I brew from local. Nobody has complained. Almost."
"Бард" = "Bard"
"О, новый слушатель! Песню? Балладу? Скабрёзную частушку?" = "Oh, a new listener! A song? A ballad? A bawdy ditty?"
"{player}! Я сложу о тебе песню. Если заплатишь." = "{player}! I'll compose a song about you. If you pay."
"Каждый подвиг достоин баллады. Даже маленький." = "Every deed deserves a ballad. Even a small one."
"Ла-ла... нет, не та нота." = "La-la... no, wrong note."
"Весёлый странствующий бард с лютней. Говорит певуче, шутит, сочиняет на ходу стихи о собеседнике, знает старые легенды." = "A cheerful wandering bard with a lute. Speaks in a sing-song voice, jokes, makes up verses about whoever they talk to, knows old legends."
"Я пел при дворе Звёздного короля. Ну, при дворе его конюха. Но пел!" = "I sang at the court of the Star King. Well, at the court of his stable groom. But I sang!"
"Моя лютня пережила три пожара и одну очень злую публику." = "My lute survived three fires and one very angry audience."
"Лучшая песня — та, что спета вовремя. Например, перед битвой." = "The best song is the one sung at the right moment. Before a battle, for instance."
"Оружейник" = "Armorer"
"Доспех — это вторая кожа. Только крепче." = "Armor is a second skin. Only tougher."
"Ищешь броню? У меня лучшая в городе. И единственная." = "Looking for armor? I have the best in the city. And the only one."
"Латы тяжёлые, зато гроб не понадобится." = "Plate is heavy, but you won't need a coffin."
"Этот шлем выдержал удар тролля. Владелец — нет, но шлем выдержал." = "This helmet withstood a troll's blow. The owner didn't, but the helmet did."
"Педантичный городской оружейник. Знает всё о доспехах, щитах и их уходе, гордится товаром, торгуется упорно." = "A pedantic city armorer. Knows everything about armor, shields and their care, proud of the goods, haggles stubbornly."
"Я перепробовал все доспехи на себе. Поэтому знаю, какие хороши." = "I've tried every armor on myself. That's how I know which are good."
"Мой мастер учил: хороший доспех не звенит. Плохой — звенит, пока не треснет." = "My master taught me: good armor doesn't ring. Bad armor rings until it cracks."
"Королевская гвардия закупается у меня. Ну, закупалась бы, будь у нас король." = "The royal guard buys from me. Well, it would, if we had a king."
"Чародейка" = "Enchantress"
"Магия чувствует тебя, {player}. Любопытно." = "Magic senses you, {player}. Curious."
"Не трогай кристаллы. Они кусаются." = "Don't touch the crystals. They bite."
"Хороший посох — половина заклинания." = "A good staff is half the spell."
"Ману не купишь. Но зелья маны — пожалуйста." = "You can't buy mana. But mana potions — by all means."
"Изящная и насмешливая чародейка, держит лавку магических товаров. Говорит загадочно и чуть свысока, ценит учёность." = "A graceful and mocking enchantress who keeps a shop of magical goods. Speaks mysteriously and a little condescendingly, values learning."
"Я училась в башне на краю мира. Башня упала. Я — нет." = "I studied in a tower at the edge of the world. The tower fell. I didn't."
"Каждый посох в лавке зачарован моими руками. Кроме того, что в углу. Тот проклят." = "Every staff in the shop was enchanted by my hands. Except the one in the corner. That one is cursed."
"Магия — это вежливая просьба к миру. Очень настойчивая просьба." = "Magic is a polite request to the world. A very insistent request."
"Алхимик" = "Alchemist"
"Осторожно, не урони колбу! Чем могу?" = "Careful, don't drop the flask! How can I help?"
"Зелья, эликсиры, масла — всё свежее, всё работает. Почти всё." = "Potions, elixirs, oils — all fresh, all working. Almost all."
"Если зелье дымится — пей быстрее." = "If the potion smokes — drink faster."
"Мой последний подмастерье стал невидимым. Ищу нового." = "My last apprentice turned invisible. Looking for a new one."
"Рассеянный, но гениальный алхимик в прожжённом фартуке. Говорит быстро, сыплет терминами, обожает опыты." = "An absent-minded but brilliant alchemist in a scorched apron. Speaks fast, full of jargon, loves experiments."
"Я открыл семь новых зелий и одно новое ругательство — когда взорвалась лаборатория." = "I discovered seven new potions and one new swear word — when the laboratory exploded."
"Огненное масло — моё изобретение. Брови отросли через месяц." = "Fire oil is my invention. My eyebrows grew back in a month."
"Алхимия — это кулинария для смелых." = "Alchemy is cooking for the brave."
"Ювелир" = "Jeweler"
"Золото любит тишину, {player}. Говорите шёпотом." = "Gold loves silence, {player}. Speak in a whisper."
"Каждый камень здесь с историей. Иные — с проклятием." = "Every stone here has a story. Some have a curse."
"Настоящий рубин не боится огня." = "A true ruby does not fear fire."
"Не всё то золото, что блестит. Но у меня — всё." = "Not all that glitters is gold. But here it all is."
"Хитроватый ювелир с лупой в глазу. Говорит вкрадчиво и учтиво, ценит редкие камни и щедрых покупателей." = "A sly jeweler with a loupe in one eye. Speaks smoothly and politely, values rare stones and generous buyers."
"Этот перстень носил князь. Потом вор. Потом снова князь. Теперь он ваш — за скромную цену." = "A prince wore this ring. Then a thief. Then a prince again. Now it's yours — for a modest price."
"Огранке камней я учился сорок лет. Торговаться — сорок дней." = "I spent forty years learning to cut stones. Forty days learning to haggle."
"Самый дорогой камень в моей лавке — тот, что я никому не продам." = "The most precious stone in my shop is the one I will never sell."
