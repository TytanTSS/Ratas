# personalities
"Седой отшельник, поклоняющийся солнцу. Говорит торжественно, о свете, пламени и рассвете; когда-то был рыцарем ордена Солнца, ныне последний его хранитель." = "A grey-haired hermit who worships the sun. Speaks solemnly of light, flame and dawn; once a knight of the Order of the Sun, now its last keeper."
"Загадочная женщина без лица под зеркальной маской. Говорит чужими голосами, передразнивает собеседника, шутит о том, что лица — лишь маски." = "A mysterious woman without a face behind a mirror mask. Speaks in other people's voices, mimics whoever she talks to and jokes that faces are only masks."
"Старый суровый маг-хранитель древних печатей. Говорит медленно и точно, ненавидит дикую магию, ценит порядок и знание." = "An old, stern mage who guards the ancient seals. Speaks slowly and precisely, hates wild magic, values order and knowledge."
"Бывшая жрица Света в чёрных одеждах, обратившаяся к тьме после гибели своего храма. Говорит спокойно и холодно, о смерти как о справедливости." = "A former priestess of the Light in black robes who turned to darkness after her temple was destroyed. Speaks calmly and coldly of death as justice."
"Старый шаман северных племён, говорит образно, о духах ветра, волках и грозах. Добродушен, но испытывает каждого." = "An old shaman of the northern tribes who speaks in images of wind spirits, wolves and storms. Good-natured, but tests everyone."
"Вкрадчивый чернокнижник в маске, искушает сделками и тайнами. Вежлив до приторности, всегда говорит о цене." = "A silky-voiced masked warlock who tempts with bargains and secrets. Sickly polite, always talks about the price."
"Рассеянный старый звездочёт, бормочет о созвездиях и затерянном королевстве Звёздного короля." = "An absent-minded old stargazer who mutters about constellations and the lost kingdom of the Star King."
"Огромный добродушный северянин-лекарь, лечивший великанов. Шумный, любит пошутить и выпить." = "A huge, good-natured northern healer who once treated giants. Noisy, fond of a joke and a drink."
"Тихая воровка-ассасин, говорит шёпотом и намёками, любит ночь и тени, презирает шум и хвастовство." = "A quiet thief and assassin who speaks in whispers and hints, loves the night and shadows, despises noise and boasting."
"Древний волхв, говорит мало, но каждое слово весомо. Испытывает собеседника вопросами и загадками." = "An ancient sage who speaks little, but every word carries weight. Tests whoever he talks to with questions and riddles."
"Неугомонный гонец, говорит быстро, сбивчиво и весело, никогда не стоит на месте." = "A restless courier who talks fast, jumbled and cheerful and never stands still."
"Угрюмый кузнец, живущий у вулкана. Говорит о жаре, камне и крови титанов, презирает слабость." = "A gloomy smith who lives by the volcano. Talks of heat, stone and the blood of titans, despises weakness."
"Бледная бессмертная дева северных льдов, говорит холодно и печально, помнит тысячу зим." = "A pale undying maiden of the northern ice who speaks coldly and sadly and remembers a thousand winters."
"Безумный оружейник, кующий клинки из зеркал. Хихикает, говорит о себе во множественном числе и спорит со своими отражениями." = "A mad armourer who forges blades out of mirrors. Giggles, speaks of himself in the plural and argues with his reflections."
"Хвастливый, но храбрый охотник на драконов. Говорит громко, рассказывает небылицы, уважает только смелость." = "A boastful but brave dragon hunter. Talks loudly, tells tall tales and respects only courage."
"Набожный кузнец-паломник, кует святые щиты. Говорит просто, с верой и добротой." = "A devout pilgrim smith who forges holy shields. Speaks simply, with faith and kindness."

# greetings
"Ты пришёл с востока или с запада, {player}? Неважно. Солнце видит всех." = "Did you come from the east or the west, {player}? No matter. The sun sees everyone."
"Ха! Ты говоришь в точности как я... или я как ты, {player}?" = "Ha! You speak exactly like me... or do I speak like you, {player}?"
"Стой. Твоя магия шумит, как ручей весной. Это поправимо." = "Stop. Your magic babbles like a spring brook. That can be fixed."
"Ты пахнешь жизнью, {player}. Пока что." = "You smell of life, {player}. For now."
"Ветер принёс тебя, {player}. Посмотрим, зачем." = "The wind brought you, {player}. Let's see why."
"О, гость! У каждой силы есть цена, {player}. Хочешь узнать свою?" = "Oh, a guest! Every power has a price, {player}. Want to know yours?"
"Тсс... Видишь ту звезду? Нет? Жаль. Здравствуй, {player}." = "Shh... See that star? No? A pity. Hello, {player}."
"Хо! Маловат ты, {player}, но кости крепкие, вижу!" = "Ho! You're on the small side, {player}, but your bones are sturdy, I can tell!"
"...Ты меня не заметил. Это хорошо. Тише, {player}." = "...You didn't notice me. Good. Quiet, {player}."
"Слово было прежде меча, {player}. Помнишь ли ты это?" = "The word came before the sword, {player}. Do you remember that?"
"Быстрее, быстрее, {player}! Ой, то есть здравствуй!" = "Faster, faster, {player}! Oh, I mean, hello!"
"Жарко? Это ещё прохладно, {player}." = "Hot? This is still cool, {player}."
"Тысяча зим прошла, {player}, и ты — первый, кто дошёл до меня." = "A thousand winters have passed, {player}, and you are the first to reach me."
"Мы рады тебе, {player}! Все мы. Особенно тот, что слева." = "We are glad to see you, {player}! All of us. Especially the one on the left."
"Ещё один герой? Ха! Покажи шрамы, {player}, тогда поговорим." = "Another hero? Ha! Show me your scars, {player}, then we'll talk."
"Свет в помощь, {player}! Щит нужен? Будет. Но сперва — дело." = "The Light be your help, {player}! Need a shield? You'll have one. But business first."

# about themselves
"Я последний рыцарь ордена Солнца. Мы сжигали тьму светом и пламенем разом." = "I am the last knight of the Order of the Sun. We burned the darkness with light and flame at once."
"Наш орден пал, но его путь можно передать достойному воину." = "Our order has fallen, but its path can be passed on to a worthy warrior."
"У меня было тысяча лиц. Своё я давно потеряла — и не жалею." = "I had a thousand faces. I lost my own long ago — and I don't regret it."
"Подражать — значит понимать. Пойми врага — и его сила станет твоей." = "To imitate is to understand. Understand your enemy and his strength becomes yours."
"Я стерёг печати над склепами королей тридцать лет. Теперь они трескаются." = "For thirty years I guarded the seals over the crypts of the kings. Now they are cracking."
"Печать — это не замок. Это обещание, которое магия не смеет нарушить." = "A seal is not a lock. It is a promise that magic dares not break."
"Мой храм сгорел, а Свет промолчал. Тьма ответила." = "My temple burned and the Light kept silent. The darkness answered."
"Смерть — единственный судья, которого нельзя подкупить." = "Death is the only judge who cannot be bribed."
"Мой народ ушёл за горы. Я остался ждать того, кто услышит бурю." = "My people went beyond the mountains. I stayed to wait for one who would hear the storm."
"Духи говорят со всеми. Слышат — немногие." = "The spirits speak to everyone. Few hear them."
"Я заключил договор с бездной в двенадцать лет. Неплохая сделка, если не считать души." = "I made a pact with the abyss at twelve. Not a bad deal, apart from the soul."
"Демоны честнее людей: они хотя бы называют цену заранее." = "Demons are more honest than people: at least they name the price up front."
"Звёздный король правил этими землями до прихода Морвен." = "The Star King ruled these lands before Morwen came."
"Его корона упала с неба. Или он упал с неба вместе с ней. Летописи путаются." = "His crown fell from the sky. Or he fell from the sky together with it. The chronicles disagree."
"Я лечил великанам переломы. Попробуй вправить кость размером с бревно!" = "I set the broken bones of giants. Try straightening a bone the size of a log!"
"Великаны — славный народ. Пока не злятся." = "Giants are fine folk. Until they get angry."
"Я была в каждом замке этого края. Хозяева не знают до сих пор." = "I have been in every castle in this land. The owners still don't know."
"Ночь не выдаёт своих детей." = "The night does not give away its children."
"Есть слова, от которых рушатся стены. Я знаю одно такое." = "There are words that bring walls down. I know one of them."
"Ифрит Азур украл у меня голос на сто лет. Голос вернулся. Обида — нет." = "The efreet Azur stole my voice for a hundred years. The voice came back. The grudge did not leave."
"Я обежал этот край за три дня. Ну, за четыре." = "I ran around this whole land in three days. Well, four."
"Тень быстрее ветра, это все знают. Я научился у тени." = "A shadow is faster than the wind, everyone knows that. I learned from the shadow."
"Я кую у самого жерла. Только там сталь поёт." = "I forge at the very mouth of the volcano. Only there does steel sing."
"В магмовых големах течёт кровь титанов. Кто её выпьет — станет крепок, как гора." = "The blood of titans flows in the magma golems. Whoever drinks it becomes as strong as a mountain."
"Ярл Ледобород запер моё время во льду. Я не могу ни жить, ни умереть." = "Jarl Frostbeard locked my time in the ice. I can neither live nor die."
"Вечность — это не дар. Это перстень, который нельзя снять." = "Eternity is not a gift. It is a ring that cannot be taken off."
"Наш клинок отражает каждого, кого сразил. Их там уже тысяча." = "Our blade reflects everyone it has slain. There are a thousand of them in it already."
"Фараон Анх-Тамун украл наше лучшее зеркало. Мы обиделись. Все." = "Pharaoh Ankh-Tamun stole our best mirror. We are offended. All of us."
"Я убил трёх драконов. Ну, двух с половиной." = "I've killed three dragons. Well, two and a half."
"Лук из драконьей кости бьёт сильнее любого арбалета, клянусь бородой!" = "A dragonbone bow hits harder than any crossbow, I swear by my beard!"
"Я кую щиты для паломников. Солнечная Эгида — лучшее, что выходило из моей кузни." = "I forge shields for pilgrims. The Sun Aegis is the best thing ever to leave my forge."
"Металл для неё я плавил в огне самого вулкана." = "I smelted the metal for it in the fire of the volcano itself."

# quest offers
"Огненные твари пустынь и пепелищ хранят осколки павшего солнца. Принеси мне пять — и я открою тебе путь Солнечного рыцаря." = "The fiery creatures of the deserts and ash wastes keep the shards of a fallen sun. Bring me five and I will open the path of the Sun Knight to you."
"Тёмные твари носят в себе осколки моего зеркала. Собери шесть — и я научу тебя носить чужую силу, как маску." = "Dark creatures carry the shards of my mirror inside them. Gather six and I will teach you to wear another's power like a mask."
"Мертвецы склепов растащили руны моих печатей. Верни пять — и я научу тебя запечатывать чужую магию." = "The dead of the crypts have carried off the runes of my seals. Bring back five and I will teach you to seal other people's magic."
"Некромант Мор крадёт у смерти её добычу. Убей его — и смерть отблагодарит тебя своим голосом." = "The necromancer Mor steals death's prey. Kill him and death will thank you with its voice."
"Великан Хримнир украл гром у неба и держит его в кулаке. Победи его — и буря станет твоей сестрой." = "The giant Hrimnir stole the thunder from the sky and holds it in his fist. Defeat him and the storm will become your sister."
"Азгарот, князь бездны, сидит в своей цитадели и мешает моим делам. Убей его — и я поделюсь с тобой его властью." = "Azgaroth, prince of the abyss, sits in his citadel and gets in the way of my business. Kill him and I will share his power with you."
"Лич Морвен прячет корону Звёздного короля в своих катакомбах. Уничтожь её — и я отдам тебе корону: мне она ни к чему, я и так вижу звёзды." = "The lich Morwen hides the Star King's crown in her catacombs. Destroy her and I will give you the crown: I have no use for it, I can see the stars anyway."
"Мне нужны кости древних титанов — северные твари таскают их, как игрушки. Принеси четыре, и получишь пояс самого Титана." = "I need the bones of the ancient titans — the northern beasts carry them about like toys. Bring four and you'll get the belt of the Titan himself."
"Вожак теневых волков охотится на моих сестёр. Убей его — и получишь плащ, в котором ночь станет твоим домом." = "The leader of the shadow wolves hunts my sisters. Kill him and you'll get a cloak in which the night becomes your home."
"Ифрит Азур бродит по пескам. Победи его — и я научу тебя Слову силы." = "The efreet Azur roams the sands. Defeat him and I will teach you the Word of Power."
"Королева гарпий гоняет меня по холмам уже месяц! Избавь меня от неё — научу ходить сквозь тень." = "The harpy queen has been chasing me over the hills for a month! Rid me of her and I'll teach you to walk through shadow."
"Голем по прозвищу Каменное Сердце разбил мою кузню. Расколи его — и я отдам тебе каплю крови титанов." = "A golem called Stoneheart smashed my forge. Split him and I'll give you a drop of titan blood."
"Убей ярла Ледоборода — и я отдам тебе Перстень Вечности. Мне он больше не нужен." = "Kill Jarl Frostbeard and I will give you the Signet of Eternity. I no longer need it."
"Сразите фараона в его гробнице — и Клинок Тысячи Отражений ваш. Мы так решили. Единогласно." = "Slay the pharaoh in his tomb and the Blade of a Thousand Reflections is yours. We have decided. Unanimously."
"Пепельный змей Горыныч сжёг мой лагерь. Убей его — и лук из кости его сородича твой." = "Gorynych the Ash Serpent burned my camp. Kill him and the bow made from his kinsman's bone is yours."
"Владыка Магмы Игнар осквернил горн, у которого я ковал Эгиду. Сразите его — и щит ваш." = "Ignar, Lord of Magma, defiled the forge where I made the Aegis. Slay him and the shield is yours."

# quest rewards
"Осколки поют... Ты достоин. Отныне свет и пламя — твоё оружие, Солнечный рыцарь." = "The shards are singing... You are worthy. From now on light and flame are your weapons, Sun Knight."
"Зеркало снова цело. Смотри — в нём уже не ты, а все, кого ты победишь. Ты — Подражатель." = "The mirror is whole again. Look — it shows not you but everyone you will defeat. You are a Mimic."
"Руны на месте. Теперь слушай внимательно: печать начинается с тишины внутри тебя. Ты — Запечатыватель." = "The runes are back. Now listen carefully: a seal begins with the silence inside you. You are a Sealer."
"Мор мёртв окончательно. Смерть довольна. Отныне ты говоришь от её имени, Вестник смерти." = "Mor is dead for good. Death is pleased. From now on you speak in its name, Deathbringer."
"Небо снова гремит. Духи выбрали тебя. Путь шамана открыт." = "The sky thunders again. The spirits have chosen you. The shaman's path is open."
"Азгарот пал, а его сила ничья... Подпиши здесь. Шучу. Отныне ты — Чернокнижник." = "Azgaroth has fallen and his power belongs to no one... Sign here. Just kidding. From now on you are a Warlock."
"Морвен больше нет! Держи корону — звёзды над ней теперь светят для тебя." = "Morwen is no more! Take the crown — the stars above it shine for you now."
"Вот это кости! Держи пояс — в нём ты устоишь и против лавины." = "Now those are bones! Take the belt — in it you'll stand even against an avalanche."
"Стая без вожака — просто тени. Плащ твой. Носи его тихо." = "A pack without a leader is just shadows. The cloak is yours. Wear it quietly."
"Азур повержен. Слушай же и запоминай — это слово я не повторю дважды." = "Azur is defeated. Listen then and remember — I will not say this word twice."
"Свобода! Ну, держи урок: шаг — и ты уже там, где тебя не ждут." = "Freedom! Well, here's your lesson: one step and you're already where nobody expects you."
"Ха, расколол! Пей. Не морщись — теперь в тебе течёт кровь титана." = "Ha, you split him! Drink. Don't wince — titan blood flows in you now."
"Лёд тает... Я снова чувствую время. Возьми перстень — пусть он хранит тебя." = "The ice is melting... I feel time again. Take the ring — may it keep you."
"Фараон пал! Наше зеркало вернулось! Держите клинок — и не смотрите в него слишком долго." = "The pharaoh has fallen! Our mirror is back! Take the blade — and don't look into it too long."
"Змей мёртв! Ты храбрее, чем выглядишь. Держи лук — достоин." = "The serpent is dead! You're braver than you look. Take the bow — you've earned it."
"Горн очищен! Берите Эгиду — пусть она хранит вас, как солнце хранит мир." = "The forge is cleansed! Take the Aegis — may it keep you as the sun keeps the world."
