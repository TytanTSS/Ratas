# English: villagers, wanderers and their lines. {player} and {village} are
# filled in by the game.
"Староста" = "Elder"
"Торговец" = "Merchant"
"Кузнец" = "Smith"
"Знахарка" = "Herbalist"
"Житель" = "Villager"
"Странствующий маг" = "Wandering Mage"

"Пожилой мудрый староста деревни. Заботится о жителях, знает местные легенды, даёт поручения храбрецам." = "The village's old, wise elder. Cares for the villagers, knows the local legends and gives tasks to the brave."
"Хитрый, но добродушный торговец. Обожает торговаться, болтлив, знает все сплетни округи." = "A cunning but good-natured merchant. Loves to haggle, talkative, knows every rumour around."
"Суровый немногословный кузнец. Уважает силу и труд, не терпит болтовни." = "A stern smith of few words. Respects strength and work and has no patience for chatter."
"Добрая, немного загадочная деревенская знахарка. Говорит мягко, любит травы и приметы." = "A kind, somewhat mysterious village herbalist. Speaks softly, loves herbs and omens."
"Спокойный деревенский жрец Света. Говорит мягко и наставительно, знает о нежити, проклятиях и святынях округи." = "A calm village priest of the Light. Speaks gently and instructively, knows about the undead, curses and the shrines around."
"Деревенский стражник, служака, немного ворчлив, но честен и храбр." = "A village guard, a dutiful soldier, a little grumpy but honest and brave."
"Простой деревенский житель. Обычные заботы: урожай, семья, страх перед монстрами." = "A simple villager. Ordinary worries: the harvest, the family, the fear of monsters."
"Благородный странствующий рыцарь павшего ордена. Говорит возвышенно, верен клятвам, помогает слабым и не терпит бесчестия." = "A noble knight-errant of a fallen order. Speaks loftily, keeps his oaths, helps the weak and cannot bear dishonour."
"Немногословный охотник-следопыт. Знает звериные тропы, недолюбливает шумных людей, торгует мясом и луками." = "A taciturn hunter and tracker. Knows the animal trails, dislikes noisy people, trades meat and bows."
"Кроткая, но стойкая паломница Света. Лечит раненых, говорит о святынях края, о страхе и надежде." = "A meek but steadfast pilgrim of the Light. Heals the wounded, speaks of the land's shrines, of fear and hope."
"Циничный, но по-своему честный наёмник. Грубоват, любит золото и хорошую драку, держит слово." = "A cynical mercenary, honest in his own way. A bit rough, loves gold and a good fight, keeps his word."
"Рассеянный и любопытный маг-исследователь. Говорит загадками и шутками, увлечён древней магией и звёздами, торгует зельями маны." = "An absent-minded, curious scholar-mage. Speaks in riddles and jokes, fascinated by ancient magic and the stars, sells mana potions."

# greetings
"Добро пожаловать в {village}, путник." = "Welcome to {village}, traveller."
"А, {player}! Рад тебя видеть." = "Ah, {player}! Glad to see you."
"Свет с тобой, {player}. Ты ранен?" = "The Light be with you, {player}. Are you hurt?"
"Приветствую, {player}. Дорога опасна — держи меч наготове." = "Greetings, {player}. The road is dangerous — keep your sword ready."
"Интересно... в тебе есть искра, {player}." = "Interesting... there is a spark in you, {player}."
"Здравствуй, путник." = "Hello, traveller."
"Добрый день!" = "Good day!"
"Мир тебе, путник." = "Peace be with you, traveller."
"Да хранит тебя Свет, странник." = "May the Light keep you, wanderer."
"Смотри в оба, путник." = "Keep your eyes open, traveller."
"Удачной охоты, путник." = "Good hunting, traveller."
"Заходи, заходи! Лучшие товары по эту сторону гор!" = "Come in, come in! The finest goods this side of the mountains!"
"Для тебя — особая цена!" = "A special price just for you!"
"Золото есть? Тогда мы друзья." = "Got gold? Then we're friends."
"Золото есть? Нет? Тогда проваливай. Шучу." = "Got gold? No? Then get lost. Just kidding."
"Чего тебе? Говори быстро, горн остывает." = "What do you want? Speak quickly, the forge is cooling."
"Ты ранен? Дай-ка взгляну." = "Are you hurt? Let me have a look."
"Травы шепчут мне о твоём приходе." = "The herbs whispered to me that you were coming."
"Свет видит твои дела. Чем помочь?" = "The Light sees your deeds. How can I help?"
"Стой! А, это ты. Проходи." = "Halt! Ah, it's you. Go on."
"Честь и сталь! Чем могу помочь путнику?" = "Honour and steel! How can I help a traveller?"
"Тише... зверя спугнёшь. А, это ты." = "Quiet... you'll scare off the game. Ah, it's you."
"Чего уставился? А, работу ищешь. Как и я." = "What are you staring at? Ah, looking for work. Same as me."
"Не мешай, я считаю звёзды. А, ладно, говори." = "Don't disturb me, I'm counting stars. Oh, fine, go on."
"Ох, не до тебя сейчас..." = "Oh, I've no time for you right now..."
"Тише, тише... времена нынче неспокойные." = "Hush, hush... these are troubled times."

# small talk
"Видел я логово чудищ на востоке. Не ходи туда в одиночку." = "I saw a monster lair in the east. Don't go there alone."
"Береги себя ночью — мёртвые не спят." = "Take care at night — the dead don't sleep."
"Мой брат ушёл в пещеры и не вернулся." = "My brother went into the caves and never came back."
"Зелья нынче в цене — все в подземелья лезут." = "Potions sell well these days — everyone's crawling into dungeons."
"Чудища всё ближе подбираются к деревне." = "The monsters creep ever closer to the village."
"Урожай в этом году скудный." = "The harvest is poor this year."
"Не ходи на болота без зелий." = "Don't go into the swamps without potions."
"Ночью на дорогах шалят разбойники." = "Bandits prowl the roads at night."
"Волки этой зимой голодные, держатся стаями." = "The wolves are hungry this winter and keep to packs."
"Говорят, в подземельях спят древние сокровища." = "They say ancient treasures sleep in the dungeons."
"В проклятых землях мёртвые не знают покоя." = "In the cursed lands the dead know no rest."
"Видал на холмах гарпий? Жуть!" = "Seen the harpies on the hills? Awful!"
"Хорошая сталь — лучший друг воина." = "Good steel is a warrior's best friend."
"Святая вода — лучший друг против нежити." = "Holy water is the best friend against the undead."
"Даже тьма боится рассвета." = "Even darkness fears the dawn."
"Орки куют паршиво, но бьют больно." = "Orcs forge poorly but hit hard."
"Принеси мне руду из пещер — сделаю тебе клинок на славу." = "Bring me ore from the caves and I'll make you a glorious blade."
"Разбойники нынче наглеют. Это хорошо для дела." = "Bandits are getting bold these days. Good for business."
"Лес кормит того, кто его уважает." = "The forest feeds those who respect it."
"Следы на снегу не врут. Люди — врут." = "Tracks in the snow don't lie. People do."
"Я поклялся очистить эти дороги от разбойников." = "I swore to clear these roads of bandits."
"Я иду от святилища к святилищу и молюсь у каждого." = "I walk from shrine to shrine and pray at each one."
"Магия этих земель неспокойна. Что-то будит древние печати." = "The magic of these lands is restless. Something is waking the ancient seals."
"Говорят, в проклятых землях есть храм, где свет ещё не угас." = "They say there is a temple in the cursed lands where the light has not yet died."

# stories
"Я староста уже тридцать зим. Помню, как здесь был лишь хутор из трёх дворов." = "I've been the elder for thirty winters. I remember when this was just a hamlet of three homesteads."
"Жена моя, светлая ей память, умела говорить с птицами. А я умею говорить с людьми — тоже дар." = "My wife, rest her soul, could talk to birds. I can talk to people — a gift too."
"В молодости я ходил с караванами до самого моря. Теперь мой караван — эта деревня." = "In my youth I travelled with caravans all the way to the sea. Now this village is my caravan."
"Я однажды продал меч самому королю. Ну, почти королю." = "I once sold a sword to the king himself. Well, almost the king."
"Начинал с лотка на ярмарке, а теперь у меня лучшая лавка на три деревни вокруг!" = "I started with a stall at the fair, and now I have the best shop for three villages around!"
"Купец, который не знает слухов, — купец без товара. Слухи я тоже продаю. Шучу. Почти." = "A merchant who knows no rumours is a merchant without goods. I sell rumours too. Just kidding. Almost."
"Я торговал даже с гномами. Попробуй их перехитри — легче гору сдвинуть." = "I even traded with dwarves. Try outwitting them — moving a mountain is easier."
"Ковать меня учил отец, его — дед. Молот этот старше нас обоих." = "My father taught me to forge, and his father taught him. This hammer is older than both of us."
"Однажды я выковал меч для рыцаря. Он вернулся через год — меч цел, рыцарь нет." = "I once forged a sword for a knight. He came back a year later — the sword intact, the knight not."
"Лучшая сталь закаляется в снегу северных гор. Да где ж его тут взять." = "The best steel is tempered in the snow of the northern mountains. If only there were any here."
"Травам меня учила бабка. Говорят, она и с болотной ведьмой знакомство водила." = "My grandmother taught me herbs. They say she was acquainted with the bog witch herself."
"Я лечу и людей, и скот, и даже упрямцев, которые лезут в подземелья." = "I heal people, cattle and even the stubborn ones who climb into dungeons."
"У каждой травы есть характер. Полынь — горькая, но честная." = "Every herb has a character. Wormwood is bitter but honest."
"Я пришёл в эту деревню, когда здесь хоронили жертв мора. Свет не дал мне уйти." = "I came to this village when they were burying the victims of the plague. The Light did not let me leave."
"Каждое утро я молюсь за путников. Помолюсь и за тебя." = "Every morning I pray for travellers. I'll pray for you too."
"Нежить боится не меча, а веры. Хотя меч тоже не помешает." = "The undead fear faith, not swords. Though a sword doesn't hurt either."
"Служу стражником пятый год. Ни одна тварь не прошла мимо моего копья." = "Five years I've served as a guard. Not one beast has got past my spear."
"До стражи я был охотником. Привычка смотреть в темноту осталась." = "Before the guard I was a hunter. The habit of watching the dark has stayed."
"Я бы и сам пошёл в подземелье, да пост не бросишь." = "I'd go into the dungeon myself, but you can't leave your post."
"Живу тут с рождения. Дальше соседней деревни и не бывал." = "I've lived here since birth. Never been further than the next village."
"Мечтаю однажды увидеть море. Говорят, оно солёное. Врут, поди." = "I dream of seeing the sea one day. They say it's salty. Probably lies."
"Мой огород — лучший в деревне. Но тыквы кто-то ворует по ночам. Наверное, гоблины." = "My vegetable patch is the best in the village. But someone steals the pumpkins at night. Goblins, probably."
"Шрам? Это от гоблина. Не смейся, он был очень большой гоблин." = "The scar? A goblin. Don't laugh, it was a very big goblin."
"Мой орден пал много лет назад. Теперь я странствую один и храню его клятвы." = "My order fell many years ago. Now I wander alone and keep its oaths."
"Я бился с драконом. Ну, с молодым. Ну, он улетел. Но бился!" = "I fought a dragon. Well, a young one. Well, it flew away. But I fought!"
"Я выслеживал белого оленя три года. Он того стоил." = "I tracked the white stag for three years. It was worth it."
"Я дала обет обойти все святилища этого края. Осталось семь." = "I vowed to visit every shrine in this land. Seven are left."
"Когда-то я была лекарем при войске. Теперь лечу тех, кого встречаю на дороге." = "I was once a healer with the army. Now I heal those I meet on the road."
"Служил пяти лордам. Трое из них мертвы, двое мне должны." = "I've served five lords. Three of them are dead, two owe me money."
"За хорошую плату я убью кого угодно. Кроме тебя — ты, похоже, платёжеспособный." = "For good pay I'll kill anyone. Except you — you look like you can pay."
"Платят немного, зато кормят. И уважают — иногда." = "The pay is small, but they feed you. And respect you — sometimes."
"Меня выгнали из академии за опыт с метеором. Зато он удался." = "They threw me out of the academy for an experiment with a meteor. It worked, though."
"Я ищу затерянные рукописи Звёздного короля. Если найдёшь — дай знать." = "I'm looking for the lost manuscripts of the Star King. Let me know if you find them."
"Знаешь, почему огонь горит? Я тоже нет, но звучит красиво." = "Do you know why fire burns? Neither do I, but it sounds lovely."
"Болотная ведьма когда-то была моей ученицей..." = "The bog witch was once my apprentice..."
