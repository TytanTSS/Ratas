# English: rogue skills and abilities.
"Быстрый выпад" = "Quick Lunge"
"Два молниеносных укола по врагу рядом." = "Two lightning-fast stabs at an adjacent enemy."
"Рывок" = "Dash"
"Мгновенный рывок вперёд сквозь опасность." = "An instant dash forward through danger."
"Рывок в направлении взгляда, задевая врагов на пути." = "A dash in the direction you face, hitting the enemies in the way."
"Дымовая завеса" = "Smoke Bomb"
"Облако дыма: огромный шанс уклониться и скорость." = "A cloud of smoke: a huge chance to dodge and speed."
"+40% уклонения и +25% скорости на 4 с." = "+40% dodge and +25% speed for 4 s."
"Уклонение" = "Evasion"
"Шанс полностью избежать удара." = "A chance to avoid a blow completely."
"Уклонение и скорость атаки." = "Dodge and attack speed."
"Уклонение и скорость." = "Dodge and speed."
"Быстрые ноги" = "Fleet Feet"
"Скорость передвижения." = "Movement speed."
"Смертоносность" = "Lethality"
"Шанс критического удара." = "Critical hit chance."
"Удары в уязвимые места." = "Blows to the weak spots."
"Критические удары смертоноснее." = "Deadlier critical hits."
"Ловкость рук" = "Sleight of Hand"
"Контратака" = "Riposte"
"Уклонение и ответный укол каждому, кто бьёт вас." = "Dodge, and a counter-stab at anyone who hits you."

"Отравленный клинок" = "Poisoned Blade"
"Удар отравленным оружием." = "A blow with a poisoned weapon."
"Удар оружием с ядом: травит 5 с и снижает сопротивление яду на 25%." = "A poisoned weapon blow: poisons for 5 s and lowers poison resistance by 25%."
"Отравляет на 5 с и снижает сопротивление яду на 20%." = "Poisons for 5 s and lowers poison resistance by 20%."
"Ядовитое облако" = "Poison Cloud"
"Облако яда травит всех врагов вокруг." = "A cloud of poison poisons every enemy around."
"Все враги в радиусе 3 отравлены на 6 с и теряют 20% сопротивления яду." = "Every enemy within 3 steps is poisoned for 6 s and loses 20% poison resistance."
"Проклятый клинок" = "Cursed Blade"
"Удар проклятым лезвием: тьма, яд и порча." = "A strike with a cursed edge: shadow, poison and blight."
"Удар оружием и тьмой: цель отравлена и теряет 15% сопротивления всему на 6 с." = "A weapon and shadow strike: the target is poisoned and loses 15% resistance to everything for 6 s."
"Проклятая рана" = "Cursed Wound"
"Чума" = "Plague"
"Склянка чумы разбивается о врагов." = "A vial of plague shatters against the enemies."
"Чумной взрыв" = "Plague Burst"
"Взрыв чумы в радиусе 2, долгий яд." = "A burst of plague within 2 steps, a long poison."
"Въедливый яд" = "Lingering Poison"
"Смертельный яд" = "Deadly Poison"
"Яд сильнее, каждый удар оружием отравляет." = "Stronger poison, every weapon blow poisons."
"Токсикология" = "Toxicology"
"Знание ядов: свои сильнее, чужие слабее." = "Knowledge of poisons: yours are stronger, others' weaker."

"Шквал ударов" = "Flurry"
"Четыре удара по одной цели." = "Four blows at a single target."
"Четыре стремительных удара по одной цели." = "Four swift blows at a single target."
"Кровопускание" = "Bloodletting"
"Глубокая рана: кровотечение и ослабленная броня." = "A deep wound: bleeding and weakened armor."
"Кровотечение на 6 с, броня цели снижена на 4." = "Bleeding for 6 s, the target's armor is reduced by 4."
"Метка смерти" = "Death Mark"
"Цель становится уязвима к физическому урону." = "The target becomes vulnerable to physical damage."
"На 10 с цель теряет 25% сопротивления физическому урону и 10% — всему." = "For 10 s the target loses 25% physical resistance and 10% resistance to everything."
"Удар милосердия" = "Coup de Grâce"
"Добивание: огромный урон по израненной цели." = "A finishing blow: huge damage to a badly wounded target."
"До +200% урона по израненному врагу." = "Up to +200% damage to a badly wounded enemy."
"+8% урона за ранг, когда рядом лишь один враг." = "+8% damage per rank when only one enemy is near."

"Стрельба" = "Archery"
"Открывает прицельный выстрел. С луком или арбалетом ранги усиливают дальний бой." = "Unlocks Aimed Shot. With a bow or crossbow the ranks strengthen ranged combat."
"Прицельный выстрел" = "Aimed Shot"
"Мощная стрела в ближайшего врага. Нужен лук или арбалет." = "A powerful arrow at the nearest enemy. Needs a bow or crossbow."
"Залп" = "Volley"
"Три стрелы веером." = "Three arrows in a fan."
"Ядовитая стрела" = "Poison Arrow"
"Ядовитые стрелы" = "Poison Arrows"
"Стрела с ядом: травит и снижает сопротивление яду. Ранги усиливают яды." = "A poisoned arrow: poisons and lowers poison resistance. Ranks strengthen poisons."
"Метка охотника" = "Hunter's Mark"
"Помечает добычу: колющий и физический урон по ней проходит сильнее." = "Marks the prey: piercing and physical damage hits it harder."
"На 8 с снижает сопротивление цели колющему урону на 30% и физическому на 10%." = "Lowers the target's piercing resistance by 30% and physical by 10% for 8 s."
"Ливень стрел" = "Arrow Rain"
"Стрелы падают с неба на большую площадь." = "Arrows fall from the sky over a large area."
"Стрелы накрывают всё в радиусе 3." = "Arrows cover everything within 3 steps."
"Зоркий глаз" = "Keen Eye"

"Обманка" = "Decoy"
"Иллюзия, на которую отвлекаются враги." = "An illusion that distracts the enemies."
"Иллюзия рядом с вами на 7 с; враги вокруг бросаются на неё." = "An illusion beside you for 7 s; the enemies around rush at it."
"Исчезновение" = "Vanish"
"Невидимость" = "Invisibility"
"Невидимость: враги теряют вас из виду, пока вы не ударите." = "Invisibility: enemies lose sight of you until you strike."
"Невидимость на 8 с: враги не видят вас, пока вы не ударите; +20% скорости." = "Invisibility for 8 s: enemies can't see you until you strike; +20% speed."
"Удар в спину" = "Backstab"
"Тройной урон из невидимости или по врагу, отвлечённому на другого." = "Triple damage from invisibility or against an enemy distracted by someone else."
"Тройной урон из невидимости или по врагу, который занят не вами." = "Triple damage from invisibility or against an enemy busy with someone else."
"Зеркальные двойники" = "Mirror Images"
"Три иллюзии разом." = "Three illusions at once."
"Три иллюзии на 8 с." = "Three illusions for 8 s."
"Отвлекающий манёвр" = "Distraction"
"+12% урона за ранг по врагу, который вас не видит или занят другим." = "+12% damage per rank against an enemy who can't see you or is busy with someone else."
"В дыму" = "In the Smoke"
"Тень" = "Shadow"

"Подражание" = "Mimicry"
"Копирует умение ближайшего врага на 2 минуты; оно появится на панели как «Копия»." = "Copies the nearest enemy's ability for 2 minutes; it appears on the hotbar as “Copy”."
"Копирует умение врага на 2 минуты. Копия слабее оригинала и зависит от уровней." = "Copies an enemy ability for 2 minutes. The copy is weaker than the original and depends on the levels."
"Копия" = "Copy"
"Скопированное умение врага. Его сила зависит от уровня врага, вашего уровня и навыков подражателя." = "An ability copied from an enemy. Its power depends on the enemy's level, your level and your mimic skills."
"Эхо" = "Echo"
"Повторяет скопированное умение с удвоенной силой." = "Repeats the copied ability with double power."
"Скопированное умение с удвоенной силой." = "The copied ability with double power."
"Чуткое подражание" = "Keen Mimicry"
"Скопированные умения сильнее на 6% за ранг." = "Copied abilities are 6% stronger per rank."
"Безупречная копия" = "Flawless Copy"
"Копии почти не уступают оригиналам: +25% к их силе." = "Copies are almost as good as the originals: +25% to their power."
"Украденная сила" = "Stolen Strength"
"Чужая сила питает вас." = "Others' strength feeds you."
"Приспособленность" = "Adaptability"
"Тело подражателя учится выдерживать любой урон." = "The mimic's body learns to withstand any damage."
