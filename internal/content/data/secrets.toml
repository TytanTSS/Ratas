# ---- Секретные классы ----

[[classes]]
key = "druid"
name = "Друид"
color = "#5ec05e"
desc = "Секретный класс. Сила леса: корни, яд, исцеление и звериные облики. Подклассы: Хранитель рощи, Оборотень."
