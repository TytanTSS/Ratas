abilities = ["thorn_whip"]
items = ["staff", "fur_cloak", "leather_armor", "potion_health", "potion_mana"]
model = "druid_hero"
secret = true

[[classes]]
key = "necromancer"
name = "Некромант"
color = "#7ad07a"
desc = "Секретный класс. Поднимает мёртвых, повелевает холодом и мором. Подклассы: Повелитель костей, Чумной мор."
