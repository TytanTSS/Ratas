# Отряды: смешанные группы, которые воюют вместе. Бойцы (role = frontline) держат врага,
# воры (skirmisher) заходят с флангов и со спины, лучники и маги (ranged, caster) стоят позади,
# шаманы (support) лечат своих, вожаки (leader) поднимают боевой дух.
# depth и themes — как у монстров; weight — частота среди отрядов той же местности.

[[squads]]
key = "bandit_gang"
name = "Банда разбойников"
themes = ["plains", "hills", "forest", "sand"]
depth = [0, 0]
weight = 6
members = [
  { monster = "bandit", count = [1, 2] },
  { monster = "bandit_thief", count = [1, 2] },
  { monster = "bandit_archer", count = [1, 2] },
  { monster = "bandit_mage", count = [0, 1] },
]

