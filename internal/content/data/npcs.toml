[[npcs]]
key = "villager"
name = "Житель"
glyph = "@"
color = "#d0d0d0"
count = [2, 3]
wander = 8
city_count = [7, 9]
greetings = ["Добрый день!", "Здравствуй, путник.", "Ох, не до тебя сейчас..."]
lines = [
  "Урожай в этом году скудный.",
  "Мой брат ушёл в пещеры и не вернулся.",
  "Видал на холмах гарпий? Жуть!",
]
persona = "Простой деревенский житель. Обычные заботы: урожай, семья, страх перед монстрами."
stories = [
  "Живу тут с рождения. Дальше соседней деревни и не бывал.",
  "Мой огород — лучший в деревне. Но тыквы кто-то ворует по ночам. Наверное, гоблины.",
  "Мечтаю однажды увидеть море. Говорят, оно солёное. Врут, поди.",
]

# ---- Странники открытого мира (world = true): бродят между деревнями и сражаются с монстрами ----

[[npcs]]
key = "knight_errant"
name = "Странствующий рыцарь"
glyph = "@"
color = "#e0e0f0"
count = [2, 3]
wander = 0
world = true
combat = "knight_errant"
greetings = [
  "Приветствую, {player}. Дорога опасна — держи меч наготове.",
  "Честь и сталь! Чем могу помочь путнику?",
]
lines = [
  "Я поклялся очистить эти дороги от разбойников.",
  "Видел я логово чудищ на востоке. Не ходи туда в одиночку.",
]
stories = [
  "Мой орден пал много лет назад. Теперь я странствую один и храню его клятвы.",
  "Я бился с драконом. Ну, с молодым. Ну, он улетел. Но бился!",
]
persona = "Благородный странствующий рыцарь павшего ордена. Говорит возвышенно, верен клятвам, помогает слабым и не терпит бесчестия."

