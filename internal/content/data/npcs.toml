  "Начинал с лотка на ярмарке, а теперь у меня лучшая лавка на три деревни вокруг!",
  "Я торговал даже с гномами. Попробуй их перехитри — легче гору сдвинуть.",
  "Купец, который не знает слухов, — купец без товара. Слухи я тоже продаю. Шучу. Почти.",
]

