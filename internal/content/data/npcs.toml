]
lines = [
  "Зелья нынче в цене — все в подземелья лезут.",
  "Я однажды продал меч самому королю. Ну, почти королю.",
]
persona = "Хитрый, но добродушный торговец. Обожает торговаться, болтлив, знает все сплетни округи."
