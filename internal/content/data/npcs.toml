# Роли жителей деревень. count — сколько таких в деревне, goods — товары торговца.

[[npcs]]
key = "elder"
name = "Староста"
glyph = "@"
color = "#f0e0a0"
count = [1, 1]
wander = 3
quest_giver = true
greetings = [
  "Добро пожаловать в {village}, путник.",
  "А, {player}! Рад тебя видеть.",
  "Тише, тише... времена нынче неспокойные.",
]
lines = [
  "Чудища всё ближе подбираются к деревне.",
  "Говорят, в подземельях спят древние сокровища.",
  "Береги себя ночью — мёртвые не спят.",
]
persona = "Пожилой мудрый староста деревни. Заботится о жителях, знает местные легенды, даёт поручения храбрецам."
stories = [
  "Я староста уже тридцать зим. Помню, как здесь был лишь хутор из трёх дворов.",
  "В молодости я ходил с караванами до самого моря. Теперь мой караван — эта деревня.",
  "Жена моя, светлая ей память, умела говорить с птицами. А я умею говорить с людьми — тоже дар.",
]

