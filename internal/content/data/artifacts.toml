# Именные артефакты. Редкость задаётся полем rarity (common, uncommon, rare, epic, legendary);
# артефакты (unique = true) без него считаются легендарными.
#
# Как их найти:
#   drop_from — монстры (обычно боссы), с которых артефакт падает с шансом drop_chance процентов (по умолчанию 35);
#   weight > 0 — изредка попадается среди обычной добычи начиная с глубины depth;
#   награды уникальных персонажей — см. uniques.toml.

