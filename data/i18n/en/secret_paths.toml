# content/data/secret_paths.toml
"Боевое знамя" = "Battle Banner"
"Полководец" = "Warlord"
"Ведёт за собой: боевое знамя, натиск и призрачный легион." = "Leads others: a battle banner, a charge and a ghostly legion."
"Знамя, натиск и легион." = "Banner, charge and legion."
"Командирский голос" = "Commanding Voice"
"Урон в ближнем бою и здоровье." = "Melee damage and health."
"Знамя вдохновляет вас и союзников." = "A banner inspires you and your allies."
"Вам и союзникам в радиусе 6: +10% урона в ближнем бою, +10% сопротивления всему и +5 брони на 20 с." = "You and allies in radius 6: +10% melee damage, +10% resistance to everything and +5 armor for 20 s."
"Рывок на 4 клетки: урон и оглушение на 1,5 с первому на пути." = "A 4-tile dash: damage and a 1.5 s stun to the first in the way."
"Легион" = "Legion"
"Призрачные солдаты встают в строй рядом с вами." = "Ghostly soldiers fall in beside you."
"Три призрачных солдата на 40 с." = "Three ghostly soldiers for 40 s."
"Призрачный солдат" = "Ghostly Soldier"
"Святополк" = "Svyatopolk"
"Старый воевода" = "the Old Voivode"
"Седой воевода в потёртой кольчуге, водивший полки в сотне сражений. Говорит по-командирски, коротко и веско, ценит смелость и верность строю." = "A grey voivode in worn mail who led regiments in a hundred battles. Speaks like a commander, briefly and weightily, values courage and keeping formation."
"Равняйсь, {player}! Шучу. Садись, послушай старика." = "Fall in, {player}! Just kidding. Sit down, listen to an old man."
"Я водил полки, когда твои деды ещё в люльках пищали." = "I led regiments when your grandfathers were still squealing in cradles."
"Один воин — это меч. Сотня воинов под знаменем — это стена." = "One warrior is a sword. A hundred warriors under a banner are a wall."
"Чёрный маршал" = "the Black Marshal"
"Чёрный маршал собирает войско мертвецов в проклятых землях. Сломи его — и я научу тебя вести за собой." = "The Black Marshal gathers an army of the dead in the cursed lands. Break him — and I will teach you to lead."
"Маршал пал! Ты бьёшься как полководец. Отныне за тобой пойдут — бери знамя." = "The Marshal has fallen! You fight like a warlord. From now on they will follow you — take the banner."
"Ассасин" = "Assassin"
"Удар из тени, дымовая завеса и смертельная метка." = "A strike from the shadows, a smoke screen and a deadly mark."
"Тень и смерть." = "Shadow and death."
"Искусство тени" = "Shadow Arts"
"Урон тьмой и урон из засады." = "Shadow damage and ambush damage."
"Удар из тени" = "Shadow Strike"
"Удар тьмой, втрое сильнее из невидимости или в спину." = "A shadow blow, three times stronger from stealth or in the back."
"Урон тьмой; из невидимости или по отвлечённой цели — втрое больше." = "Shadow damage; triple from stealth or at a distracted target."
"Дымовая бомба" = "Smoke Bomb"
"Вы исчезаете в облаке дыма." = "You vanish in a cloud of smoke."
"Невидимость и +30% к скорости бега на 6 с." = "Stealth and +30% running speed for 6 s."
"Метка, медленно и верно убивающая цель." = "A mark that slowly but surely kills the target."
"Тьма терзает цель 10 с и снижает её защиту от тьмы на 25%." = "Darkness torments the target for 10 s and lowers its shadow protection by 25%."
"Мастер гильдии убийц" = "Guildmaster of Assassins"
"Безликий мастер гильдии убийц в чёрном. Говорит тихо, вежливо и страшно, о цене жизни и о тишине; никогда не называет настоящего имени." = "The faceless master of the assassins' guild, dressed in black. Speaks quietly, politely and frighteningly, of the price of a life and of silence; never says a real name."
"Ты меня нашёл, {player}. Значит, я этого хотел." = "You found me, {player}. That means I wanted you to."
"У гильдии нет имени. У меня — тоже." = "The guild has no name. Neither do I."
"Чёрная роза — наш знак. Её оставляют на телах." = "The black rose is our sign. It is left on the bodies."
"Наши розы растащили культисты и разбойники. Верни пять чёрных роз — и гильдия примет тебя." = "Cultists and bandits have carried off our roses. Bring back five black roses — and the guild will accept you."
"Пять роз. Ни одной лишней крови... почти. Ты — ассасин. Не ищи меня — я найду тебя сам." = "Five roses. Not a drop of needless blood... almost. You are an assassin. Don't look for me — I will find you."
"Чёрная роза" = "Black Rose"
"Знак гильдии убийц. Нужна Тени." = "The sign of the assassins' guild. Shade needs it."
"Щит маны" = "Mana Shield"
"Архимаг" = "Archmage"
"Чистая тайная магия: сферы, щит маны и метеор." = "Pure arcane magic: orbs, a mana shield and a meteor."
"Высшая магия." = "High magic."
"Высшая магия" = "High Magic"
"Сила заклинаний и урон тайной магией." = "Spell power and arcane damage."
"Тайная сфера" = "Arcane Orb"
"Медленная сфера, взрывающаяся тайной магией." = "A slow orb that bursts with arcane magic."
"Взрыв тайной магии в радиусе 2." = "An arcane blast in radius 2."
"Мерцающий щит из чистой маны." = "A shimmering shield of pure mana."
"12 с: +25% сопротивления всему и +10 брони." = "12 s: +25% resistance to everything and +10 armor."
"С неба падает пылающий камень." = "A flaming stone falls from the sky."
"Огромный взрыв в радиусе 3: огонь и тайная магия пополам." = "A huge blast in radius 3: fire and arcane magic in halves."
"Аркадий" = "Arkadiy"
"Последний архимаг" = "the Last Archmage"
"Древний архимаг павшей академии, высокомерный и рассеянный. Говорит длинно и учёно, ценит знание, презирает невежество и спешку." = "An ancient archmage of a fallen academy, haughty and absent-minded. Speaks at length and learnedly, values knowledge, despises ignorance and haste."
"Ты умеешь читать, {player}? Уже неплохо для начала." = "Can you read, {player}? Not bad for a start."
"Академия сгорела, но знание не горит. Оно лишь прячется в кристаллах." = "The academy burned, but knowledge does not burn. It only hides in crystals."
"Магия — это не взмах посохом. Это сорок лет за книгами." = "Magic is not a wave of a staff. It is forty years over books."
"Кристаллы с записями академии растащили твари подземелий. Верни пять — и я передам тебе высшую магию." = "The creatures of the dungeons carried off the crystals with the academy's records. Return five — and I will pass the high magic to you."
"Кристаллы... знания живы! Ты достоин зваться архимагом. Не трать силу на пустяки." = "The crystals... the knowledge lives! You are worthy of being called an archmage. Do not waste the power on trifles."
"Кристалл академии" = "Academy Crystal"
"В кристалле застыли строки заклинаний. Нужен Аркадию." = "Lines of spells are frozen in the crystal. Arkadiy needs it."
"Пророчество" = "Prophecy"
"Предначертание" = "Fate"
"Оракул" = "Oracle"
"Видит будущее: пророчества, цепи света и рок." = "Sees the future: prophecies, chains of light and fate."
"Предвидение." = "Foresight."
"Предвидение" = "Foresight"
"Вы и союзники видите удары врагов заранее." = "You and allies see enemy blows coming."
"Вам и союзникам в радиусе 5: +15% уклонения и +10% крит. шанса на 15 с." = "You and allies in radius 5: +15% dodge and +10% crit chance for 15 s."
"Цепь света" = "Chain of Light"
"Свет перескакивает с врага на врага." = "Light leaps from enemy to enemy."
"Свет перескакивает на 5 врагов." = "Light leaps to 5 enemies."
"Судьба настигает всех врагов вокруг." = "Fate overtakes every enemy around."
"Свет в радиусе 4 и оглушение на 2 с." = "Light in radius 4 and a 2 s stun."
"Ведана" = "Vedana"
"Вещая" = "the Seer"
"Слепая провидица с повязкой на глазах, видящая будущее. Говорит загадками и притчами, часто отвечает раньше, чем спросят." = "A blind seer with a cloth over her eyes who sees the future. Speaks in riddles and parables, often answers before being asked."
"Я знала, что ты придёшь, {player}. И знаю, что спросишь." = "I knew you would come, {player}. And I know what you will ask."
"Глаза мне не нужны. Я вижу то, что будет, а не то, что есть." = "I don't need eyes. I see what will be, not what is."
"Кости древних оракулов шепчут. Слушай." = "The bones of ancient oracles whisper. Listen."
"Кости оракулов разнесли мертвецы гробниц. Принеси пять — и я открою тебе глаза, которыми вижу сама." = "The dead of the tombs scattered the oracle bones. Bring five — and I will open the eyes I see with."
"Кости поют... Теперь и ты слышишь будущее. Ты — оракул. Не бойся того, что увидишь." = "The bones sing... Now you hear the future too. You are an oracle. Do not fear what you see."
"Кость оракула" = "Oracle Bone"
"Исписанная знаками кость. Нужна Ведане." = "A bone covered with signs. Vedana needs it."
"Огненный провидец" = "Fireseer"
"Духи огня и лава: извержения и пламенные духи." = "Fire spirits and lava: eruptions and flame spirits."
"Пламя недр." = "The flame of the depths."
"Кровь магмы" = "Magma Blood"
"Урон огнём и защита от него." = "Fire damage and protection from it."
"Выброс лавы" = "Lava Burst"
"Сгусток лавы поджигает врагов." = "A clot of lava sets enemies on fire."
"Огонь в радиусе 1 и горение на 4 с." = "Fire in radius 1 and burning for 4 s."
"Духи пламени" = "Flame Spirits"
"Огненные духи бьются за вас." = "Fire spirits fight for you."
"Два огненных беса на 40 с." = "Two fire imps for 40 s."
"Извержение" = "Eruption"
"Земля вокруг взрывается огнём." = "The ground around erupts in fire."
"Огонь в радиусе 4: огромный урон." = "Fire in radius 4: huge damage."
"Угрюм" = "Ugryum"
"Хранитель жерла" = "Keeper of the Crater"
"Мрачный шаман с обожжённым лицом, живущий у вулкана. Говорит отрывисто, о пламени, пепле и гневе земли; не терпит холодных людей." = "A gloomy shaman with a burned face who lives by the volcano. Speaks curtly, of flame, ash and the wrath of the earth; can't stand cold people."
"Ты пахнешь холодом, {player}. Подойди к огню." = "You smell of cold, {player}. Come closer to the fire."
"Вулкан — сердце мира. Я слушаю, как оно бьётся." = "The volcano is the heart of the world. I listen to it beat."
"Огонь не злой. Он голодный." = "Fire is not evil. It is hungry."
"Огнежор" = "Fire-Eater"
"Саламандра Огнежор пожирает духов пламени. Убей её — и духи станут твоими." = "The salamander Fire-Eater devours the flame spirits. Kill it — and the spirits will become yours."
"Огнежор мёртв, духи свободны. Они выбрали тебя, провидец." = "Fire-Eater is dead, the spirits are free. They have chosen you, seer."
"Доспех из душ" = "Soul Armor"
"Пожиратель душ" = "Soul Eater"
"Вырывает души врагов и питается ими." = "Rips out enemies' souls and feeds on them."
"Голод души." = "Soul hunger."
"Голод" = "Hunger"
"Вампиризм и урон тьмой." = "Life leech and shadow damage."
"Вырвать душу" = "Soul Rip"
"Тьма вырывает кусок души врага." = "Darkness rips out a piece of an enemy's soul."
"Урон тьмой, половина возвращается здоровьем." = "Shadow damage, half of it returns as health."
"Пленённые души заслоняют вас." = "Captured souls shield you."
"15 с: +30% сопротивления тьме, +6 брони, +4 к восстановлению здоровья." = "15 s: +30% shadow resistance, +6 armor, +4 health regeneration."
"Жатва душ" = "Soul Harvest"
"Души всех врагов вокруг идут вам на пищу." = "The souls of every enemy around become your food."
"Тьма в радиусе 4: урон, треть возвращается здоровьем." = "Darkness in radius 4: damage, a third returns as health."
"Безымянный" = "the Nameless"
"Тот, кто съел своё имя" = "One Who Ate His Name"
"Иссохший чернокнижник, поглотивший столько душ, что забыл собственное имя. Говорит шёпотом, путает «я» и «мы», голоден всегда." = "A withered warlock who devoured so many souls that he forgot his own name. Speaks in a whisper, mixes up 'I' and 'we', is always hungry."
"Мы чуем тебя, {player}. Твоя душа... вкусная. Шучу. Наверное." = "We smell you, {player}. Your soul... is tasty. Just kidding. Probably."
"У меня было имя. Я его съел. Оно было последним." = "I had a name. I ate it. It was the last one."
"Души — как свечи. Одни горят ярко, другие чадят." = "Souls are like candles. Some burn bright, others smoke."
"Плакальщица Ночи" = "the Night Mourner"
"Банши Плакальщица крадёт души, что принадлежат нам. Убей её — и научим тебя есть души." = "The banshee called the Night Mourner steals souls that belong to us. Kill her — and we will teach you to eat souls."
"Её души теперь наши... и твои. Ешь, Пожиратель. Только не всех сразу." = "Her souls are ours now... and yours. Eat, Soul Eater. Just not all at once."
"Лунный холод" = "Moon Chill"
"Затмение" = "Eclipse"
"Хранитель луны" = "Moonkeeper"
"Лунный свет и звездопад: тайная магия и холод ночи." = "Moonlight and starfall: arcane magic and the cold of the night."
"Свет луны." = "Moonlight."
"Лунный свет" = "Moonlight"
"Урон тайной магией и холодом." = "Arcane and cold damage."
"Лунный луч" = "Moonbeam"
"Холодный луч луны замедляет врага." = "A cold moonbeam slows an enemy."
"Тайная магия и замедление на 40% на 4 с." = "Arcane magic and a 40% slow for 4 s."
"Звездопад" = "Starfall"
"Звёзды падают на врагов." = "Stars fall on enemies."
"Тайная магия в радиусе 3." = "Arcane magic in radius 3."
"Лунное затмение" = "Lunar Eclipse"
"Затмение лишает врагов магии." = "An eclipse robs enemies of magic."
"Тайная магия в радиусе 5 и печать молчания на 3 с." = "Arcane magic in radius 5 and a 3 s seal of silence."
"Луняна" = "Lunyana"
"Сова ночи" = "Owl of the Night"
"Бледная друидесса с совой на плече, бодрствующая только ночью. Говорит тихо и певуче, о луне, звёздах и снах." = "A pale druidess with an owl on her shoulder who is awake only at night. Speaks softly and melodiously, of the moon, the stars and dreams."
"Ты не спишь, {player}? Хорошо. Луна любит неспящих." = "You're not asleep, {player}? Good. The moon loves the sleepless."
"Днём я сплю. Днём мир слишком громкий." = "I sleep by day. The world is too loud by day."
"Каждая звезда — чей-то сон. Некоторые сны падают." = "Every star is someone's dream. Some dreams fall."
"Бледный странник" = "the Pale Wanderer"
"Призрак Бледный странник ворует сны спящих. Упокой его — и луна откроется тебе." = "The ghost called the Pale Wanderer steals the dreams of sleepers. Lay him to rest — and the moon will open to you."
"Сны вернулись к спящим. Луна видит тебя, хранитель." = "The dreams have returned to the sleepers. The moon sees you, keeper."
"Ужас" = "Dread"
"Призрачная форма" = "Spectral Form"
"Повелитель призраков" = "Wraithlord"
"Призраки, вопль мёртвых и бесплотная форма." = "Ghosts, the wail of the dead and an ethereal form."
"Мир теней." = "The world of shades."
"Бесплотность" = "Ethereality"
"Уклонение и защита от тьмы." = "Dodge and protection from darkness."
"Зов призраков" = "Call of Ghosts"
"Призраки служат вам." = "Ghosts serve you."
"Два призрака на 40 с." = "Two ghosts for 40 s."
"Вопль мёртвых" = "Wail of the Dead"
"Вопль ранит и обессиливает врагов." = "A wail that wounds and weakens enemies."
"Тьма в радиусе 4 и −30% скорости атаки врагов на 6 с." = "Darkness in radius 4 and −30% enemy attack speed for 6 s."
"Вы становитесь почти бесплотным." = "You become almost incorporeal."
"10 с: +40% уклонения, +20% скорости бега, +30% сопротивления физическому урону." = "10 s: +40% dodge, +20% running speed, +30% physical resistance."
"Призрак-слуга" = "Servant Ghost"
"Тризна" = "Trizna"
"Плакальщица мёртвых" = "Mourner of the Dead"
"Седая плакальщица, что говорит с мёртвыми на погостах. Говорит печально и тепло, о покое, памяти и неупокоенных душах." = "A grey mourner who speaks with the dead in graveyards. Speaks sadly and warmly, of peace, memory and restless souls."
"Ты живой, {player}? Тогда помолчи немного. Они слушают." = "Are you alive, {player}? Then be quiet for a while. They are listening."
"Мёртвые не злые. Им просто холодно и одиноко." = "The dead are not evil. They are just cold and lonely."
"Я оплакала тысячу душ. Некоторые до сих пор приходят сказать спасибо." = "I have mourned a thousand souls. Some still come to say thank you."
"Лич Морвен держит души в клетке своей филактерии. Освободи их — и призраки пойдут за тобой добровольно." = "The lich Morwen keeps souls caged in her phylactery. Free them — and the ghosts will follow you willingly."
"Души свободны... и некоторые остались с тобой. Береги их, повелитель призраков." = "The souls are free... and some have stayed with you. Look after them, lord of ghosts."
"Звёздный лучник" = "Starshot"
"Стрелы из звёздного света: тайная магия на огромном расстоянии." = "Arrows of starlight: arcane magic at a huge range."
"Стрелы звёзд." = "Arrows of the stars."
"Небесная меткость" = "Celestial Aim"
"Урон тайной магией и в дальнем бою." = "Arcane and ranged damage."
"Звёздная стрела" = "Star Arrow"
"Стрела света летит очень далеко." = "An arrow of light flies very far."
"Тайная магия на 13 клеток." = "Arcane magic over 13 tiles."
"Созвездие" = "Constellation"
"Пять звёздных стрел разом." = "Five star arrows at once."
"Пять стрел тайной магии веером." = "Five arcane arrows in a fan."
"Сверхновая" = "Supernova"
"Стрела взрывается, как рождение звезды." = "An arrow bursts like the birth of a star."
"Взрыв в радиусе 4: тайная магия и огонь пополам." = "A blast in radius 4: arcane magic and fire in halves."
"Астра" = "Astra"
"Небесная лучница" = "the Celestial Archer"
"Высокая лучница с серебряными волосами и луком, сияющим как звезда. Говорит мечтательно, о небе, звёздах и падающих огнях." = "A tall archer with silver hair and a bow shining like a star. Speaks dreamily, of the sky, the stars and falling lights."
"Смотри вверх, {player}. Там всегда кто-то целится." = "Look up, {player}. Someone is always taking aim up there."
"Я стреляю звёздами. Они возвращаются на небо, когда я промахиваюсь." = "I shoot stars. They return to the sky when I miss."
"Звёздная пыль падает на землю каждую ночь. Её подбирают не те." = "Star dust falls to the ground every night. The wrong ones pick it up."
"Твари севера собирают звёздную пыль, как сороки. Принеси шесть горстей — и я научу тебя стрелять звёздами." = "The creatures of the north collect star dust like magpies. Bring six handfuls — and I will teach you to shoot stars."
"Пыль снова сияет. Натягивай тетиву, звёздный лучник, — небо твоё." = "The dust shines again. Draw the string, starshot — the sky is yours."
"Звёздная пыль" = "Star Dust"
"Мерцающая пыль павших звёзд. Нужна Астре." = "The shimmering dust of fallen stars. Astra needs it."
"Рог охоты" = "Horn of the Hunt"
"Дикая охота" = "Wild Hunt"
"Призрачная свора и рог охоты." = "A spectral pack and the horn of the hunt."
"Гон." = "The chase."
"Владыка охоты" = "Lord of the Hunt"
"Здоровье и урон любого боя." = "Health and damage of every kind of fight."
"Призрачная свора" = "Spectral Pack"
"Три призрачных пса гонят добычу." = "Three spectral hounds chase the prey."
"Три призрачных пса на 30 с." = "Three spectral hounds for 30 s."
"Звук рога гонит вас и союзников вперёд." = "The sound of the horn drives you and your allies onward."
"Вам и союзникам в радиусе 6: +20% скорости бега и атаки на 15 с." = "You and allies in radius 6: +20% running and attack speed for 15 s."
"Призрачный егерь" = "Spectral Huntsman"
"Сам Егерь Дикой охоты приходит на зов." = "The Huntsman of the Wild Hunt himself answers the call."
"Призрачный егерь на 45 с." = "A spectral huntsman for 45 s."
"Призрачный пёс" = "Spectral Hound"
"Гон" = "Gon"
"Ловчий Дикой охоты" = "Huntsman of the Wild Hunt"
"Призрачный ловчий в рогатом шлеме, ведущий Дикую охоту по ночам. Говорит гулко, о погоне, добыче и вечной охоте." = "A spectral huntsman in a horned helm who leads the Wild Hunt by night. Speaks hollowly, of the chase, the prey and the eternal hunt."
"Ты слышишь рог, {player}? Нет? Ещё услышишь." = "Do you hear the horn, {player}? No? You will."
"Моя охота не кончается. Добыча сменяется, охотник — никогда." = "My hunt never ends. The prey changes, the hunter never does."
"Свора бежит за тем, кто бежит. Не беги." = "The pack runs after whoever runs. Don't run."
"Седой Вожак" = "the Grey Leader"
"Седой Вожак увёл мою свору за собой. Убей его — и свора признает тебя." = "The Grey Leader has led my pack away. Kill him — and the pack will acknowledge you."
"Свора вернулась... и смотрит на тебя. Труби в рог, ловчий." = "The pack has returned... and is looking at you. Sound the horn, huntsman."
"Аватар света" = "Avatar of Light"
"Рыцарь Грааля" = "Grail Knight"
"Хранитель святой чаши: исцеление, святое копьё и аватар света." = "Keeper of the holy cup: healing, a holy lance and an avatar of light."
"Сила чаши." = "The power of the cup."
"Глоток из чаши" = "Sip from the Cup"
"Сила лечения и урон светом." = "Healing power and holy damage."
"Свет Грааля" = "Light of the Grail"
"Чаша изливает исцеление на всех вокруг." = "The cup pours healing on everyone around."
"Большое исцеление вас и союзников в радиусе 6." = "A big heal for you and allies in radius 6."
"Святое копьё" = "Holy Lance"
"Копьё света пронзает и оглушает." = "A lance of light pierces and stuns."
"Свет и оглушение на 1 с." = "Light and a 1 s stun."
"Вы становитесь живым светом." = "You become living light."
"15 с: +25% сопротивления всему, +40% урона светом, +20% в ближнем бою." = "15 s: +25% resistance to everything, +40% holy damage, +20% melee."
"Персиваль" = "Perceval"
"Хранитель Чаши" = "Keeper of the Cup"
"Благородный седой рыцарь, всю жизнь искавший святую чашу и нашедший её. Говорит возвышенно и учтиво, о чистоте, служении и подвиге." = "A noble grey knight who sought the holy cup all his life and found it. Speaks loftily and courteously, of purity, service and great deeds."
"Мир тебе, {player}. Твоё сердце чисто? Чаша скажет." = "Peace to you, {player}. Is your heart pure? The cup will tell."
"Я искал Чашу сорок лет. Она была у меня в руках с самого начала." = "I sought the Cup for forty years. It was in my hands from the very beginning."
"Чаша не даёт силу. Она показывает, сколько силы в тебе." = "The Cup does not give strength. It shows how much strength is in you."
"Орочий вождь Гром осквернил часовню Чаши под горами. Сразите его — и Чаша примет вас." = "The orc warlord Grom has desecrated the chapel of the Cup beneath the mountains. Slay him — and the Cup will accept you."
"Часовня очищена. Пейте из Чаши, рыцарь Грааля, и несите свет." = "The chapel is cleansed. Drink from the Cup, Grail Knight, and carry the light."
"Нечестивый аватар" = "Unholy Avatar"
"Клятвопреступник" = "Oathbreaker"
"Паладин, нарушивший клятву: свет и тьма в одном ударе, аура ужаса." = "A paladin who broke the oath: light and darkness in one blow, an aura of dread."
"Нарушенная клятва." = "The broken oath."
"Нарушенная клятва" = "Broken Oath"
"Урон тьмой и вампиризм." = "Shadow damage and life leech."
"Тёмная кара" = "Dark Smite"
"Удар светом и тьмой разом." = "A blow of light and darkness at once."
"Урон тьмой и светом пополам." = "Shadow and holy damage in halves."
"Аура ужаса" = "Aura of Dread"
"Враги вокруг слабеют от страха." = "Enemies around weaken with fear."
"Враги в радиусе 4 на 8 с теряют 15% сопротивления всему и 15% скорости атаки." = "Enemies in radius 4 lose 15% resistance to everything and 15% attack speed for 8 s."
"Тьма заполняет вас целиком." = "Darkness fills you completely."
"15 с: +40% урона тьмой, +8% вампиризма, +10 брони." = "15 s: +40% shadow damage, +8% life leech, +10 armor."
"Мордред" = "Mordred"
"Падший паладин" = "the Fallen Paladin"
"Падший паладин в почерневших латах, нарушивший клятву ради мести. Говорит горько и насмешливо, о лицемерии святош и цене клятв." = "A fallen paladin in blackened plate who broke his oath for revenge. Speaks bitterly and mockingly, of the hypocrisy of the pious and the price of oaths."
"Ещё один праведник, {player}? Посмотрим, надолго ли." = "Another righteous one, {player}? Let's see how long it lasts."
"Я поклялся защищать. Защищал. А потом понял, кого." = "I swore to protect. I protected. And then I realized whom."
"Свет и тьма — две руки одного бога. Я просто перестал прятать левую." = "Light and darkness are two hands of one god. I just stopped hiding the left one."
"Падший брат Ансельм" = "Fallen Brother Anselm"
"Мой бывший брат по ордену, Ансельм, восстал из могилы и всё ещё судит живых. Положи этому конец — и я научу тебя силе нарушенной клятвы." = "My former brother of the order, Anselm, has risen from the grave and still judges the living. Put an end to it — and I will teach you the power of a broken oath."
"Ансельм наконец мёртв. Видишь? Клятвы — для мертвецов. Ты свободен, клятвопреступник." = "Anselm is finally dead. You see? Oaths are for the dead. You are free, oathbreaker."
"Качка" = "Sway"
"Пьяный мастер" = "Drunken Master"
"Шатается, как пьяный, но не пропускает ни удара; плюётся огненным вином." = "Staggers like a drunk but never misses a blow; spits fiery wine."
"Пьяный кулак." = "The drunken fist."
"Пошатывание" = "Stagger"
"Пьяный шквал" = "Drunken Flurry"
"Пять беспорядочных, но метких ударов." = "Five erratic but accurate blows."
"Пять ударов по одной цели." = "Five blows at one target."
"Вас невозможно задеть." = "You are impossible to hit."
"10 с: +40% уклонения." = "10 s: +40% dodge."
"Огненный плевок" = "Fire Spit"
"Глоток крепкого вина — и струя огня." = "A sip of strong wine — and a jet of fire."
"Три струи огня веером." = "Three jets of fire in a fan."
"Хмель" = "Khmel"
"Бродячий мастер" = "the Wandering Master"
"Весёлый старый монах с кувшином, вечно навеселе, но непобедимый в бою. Говорит заплетающимся языком, шутит и икает, мудрость прячет в прибаутках." = "A cheerful old monk with a jug, forever tipsy but undefeated in battle. Speaks with a slurred tongue, jokes and hiccups, hides wisdom in sayings."
"Ик! Ты кто? А, {player}! Садись, выпьем! Ик!" = "Hic! Who are you? Ah, {player}! Sit down, let's drink! Hic!"
"Трезвый боец думает. Пьяный — просто бьёт. Ик." = "A sober fighter thinks. A drunk one just hits. Hic."
"Мой учитель пил тридцать лет и не проиграл ни одного боя. Ни одного трезвого боя." = "My teacher drank for thirty years and never lost a fight. Not a single sober fight."
"Разбойники растащили мои кувшины со старым вином! Верни пять — и научу пьяному кулаку. Ик!" = "Bandits have carried off my jugs of old wine! Bring back five — and I'll teach you the drunken fist. Hic!"
"Моё вино! Ик! Держи кувшин, ученик. Пей — и бей. Ты — пьяный мастер!" = "My wine! Hic! Take the jug, student. Drink — and strike. You are a drunken master!"
"Кувшин старого вина" = "Jug of Old Wine"
"Пахнет так, что голова кружится. Нужен Хмелю." = "It smells so strong your head spins. Khmel needs it."
"Кулак дракона" = "Dragon Fist"
"Ци дракона: огненные удары и взлёт дракона." = "The chi of the dragon: fiery blows and the dragon's ascent."
"Дух дракона." = "The spirit of the dragon."
"Дух дракона" = "Dragon Spirit"
"Урон в ближнем бою и огнём." = "Melee and fire damage."
"Ладонь дракона" = "Dragon Palm"
"Огненный удар, оставляющий ожог." = "A fiery blow that leaves a burn."
"Огонь и дробящий урон пополам, горение на 4 с." = "Fire and blunt damage in halves, burning for 4 s."
"Бросок дракона" = "Dragon Rush"
"Огненный рывок сквозь врагов." = "A fiery dash through enemies."
"Рывок на 5 клеток с огненным ударом." = "A 5-tile dash with a fiery blow."
"Взлёт дракона" = "Dragon Ascent"
"Вы взмываете вверх в столбе пламени." = "You soar up in a pillar of flame."
"Огонь в радиусе 4 и оглушение на 1,5 с." = "Fire in radius 4 and a 1.5 s stun."
"Шэнь" = "Shen"
"Ученик дракона" = "Disciple of the Dragon"
"Суровый монах с драконьими татуировками, медитирующий у вулкана. Говорит размеренно, о дыхании, огне и дисциплине." = "A stern monk with dragon tattoos who meditates by the volcano. Speaks measuredly, of breath, fire and discipline."
"Дыши, {player}. Глубже. Ещё. Теперь можешь говорить." = "Breathe, {player}. Deeper. Again. Now you may speak."
"Дракон спит в каждом из нас. Почти у всех — крепко." = "A dragon sleeps in each of us. In almost everyone — soundly."
"Огонь — это дыхание, которое стало ударом." = "Fire is a breath that has become a blow."
"Игнар, Владыка Магмы, пьёт пламя дракона из недр вулкана. Победи его — и дракон проснётся в тебе." = "Ignar, Lord of Magma, drinks the dragon's flame from the depths of the volcano. Defeat him — and the dragon will awaken in you."
"Пламя вернулось в недра. Дракон проснулся. Дыши огнём, ученик." = "The flame has returned to the depths. The dragon has awakened. Breathe fire, disciple."
"Плач" = "Lament"
"Пляска смерти" = "Dance of Death"
"Певец тризны" = "Dirgesinger"
"Погребальные песни: тьма, плач и пляска смерти." = "Funeral songs: darkness, lament and the dance of death."
"Песни смерти." = "Songs of death."
"Погребальный напев" = "Funeral Chant"
"Погребальная песнь" = "Funeral Song"
"Песнь, от которой стынет кровь." = "A song that makes the blood run cold."
"Тьма в радиусе 4 и тьма терзает врагов 6 с." = "Darkness in radius 4, and darkness torments enemies for 6 s."
"Реквием" = "Requiem"
"Скорбная нота перелетает от врага к врагу." = "A mournful note flies from enemy to enemy."
"Тьма перескакивает на 4 врагов." = "Darkness leaps to 4 enemies."
"Вы и союзники пьёте жизнь врагов." = "You and allies drink the life of enemies."
"Вам и союзникам в радиусе 5: +6% вампиризма и +15% урона в ближнем бою на 12 с." = "You and allies in radius 5: +6% life leech and +15% melee damage for 12 s."
"Вран" = "Vran"
"Поющий на тризнах" = "Singer of the Wake"
"Бледный скальд в чёрном плаще с вороньими перьями, поющий на поминках. Говорит нараспев и печально, о мёртвых героях и последних песнях." = "A pale skald in a black cloak with raven feathers who sings at wakes. Speaks in a sing-song, sad voice, of dead heroes and last songs."
"Я спою и на твоей тризне, {player}. Но не сегодня." = "I will sing at your wake too, {player}. But not today."
"Каждому герою — своя последняя песня. Я знаю их все." = "Every hero has a last song. I know them all."
"Могильные цветы растут только там, где плакали." = "Grave flowers grow only where someone wept."
"Принеси мне пять могильных цветов — их носят мертвецы склепов и болот. Тогда я научу тебя песням тризны." = "Bring me five grave flowers — the dead of the crypts and swamps carry them. Then I will teach you the songs of the wake."
"Цветы... Теперь твоя песня зазвучит над павшими врагами. Пой, певец тризны." = "The flowers... Now your song will sound over fallen enemies. Sing, singer of the wake."
"Могильный цветок" = "Grave Flower"
"Бледный цветок с запахом холодной земли. Нужен Врану." = "A pale flower smelling of cold earth. Vran needs it."
"Руна стужи" = "Rune of Frost"
"Руна щита" = "Rune of Aegis"
"Рунный скальд" = "Rune Skald"
"Руны льда, грома и защиты, вырезанные голосом." = "Runes of ice, thunder and protection, carved with the voice."
"Песни рун." = "Songs of runes."
"Мана и сопротивление всему." = "Mana and resistance to everything."
"Руна холода сковывает врагов вокруг." = "A rune of cold binds enemies around."
"Холод в радиусе 3 и замедление на 50% на 5 с." = "Cold in radius 3 and a 50% slow for 5 s."
"Руна грома" = "Rune of Thunder"
"Брошенная руна взрывается молнией." = "A thrown rune bursts with lightning."
"Молния в радиусе 2." = "Lightning in radius 2."
"Руна защиты над вами и союзниками." = "A rune of protection over you and your allies."
"Вам и союзникам в радиусе 5: +12 брони и +15% сопротивления всему на 15 с." = "You and allies in radius 5: +12 armor and +15% resistance to everything for 15 s."
"Эйнар" = "Einar"
"Резчик рун" = "the Rune Carver"
"Могучий северный скальд, вырезающий руны на камнях. Говорит громко и нараспев, о богах, рунах и подвигах предков." = "A mighty northern skald who carves runes on stones. Speaks loudly and in a chant, of gods, runes and the deeds of ancestors."
"Хей, {player}! Руны сказали, что ты придёшь. Руны не врут. Почти." = "Hey, {player}! The runes said you would come. Runes don't lie. Almost."
"Каждая руна — это песня, застывшая в камне." = "Every rune is a song frozen in stone."
"Ярл Ледобород украл мой камень рун. Камень весит как бык." = "Jarl Frostbeard stole my rune stone. The stone weighs as much as a bull."
"Ярл Ледобород держит мой камень рун в своих чертогах. Убей его — и я научу тебя петь руны." = "Jarl Frostbeard keeps my rune stone in his halls. Kill him — and I will teach you to sing runes."
"Камень снова мой! Слушай песню рун, брат, — теперь она и твоя." = "The stone is mine again! Listen to the song of runes, brother — now it is yours too."
"Чёрная смерть" = "Black Death"
"Чумной доктор" = "Plague Doctor"
"Лечит болезнь болезнью: чумные склянки и чёрная смерть для врагов." = "Cures disease with disease: plague flasks and the black death for enemies."
"Миазмы." = "Miasma."
"Миазмы" = "Miasma"
"Урон ядом и защита от него." = "Poison damage and protection from it."
"Чумная склянка" = "Plague Flask"
"Склянка с заразой разбивается среди врагов." = "A flask of contagion shatters among enemies."
"Яд в радиусе 2 и болезнь на 8 с." = "Poison in radius 2 and disease for 8 s."
"Пиявки" = "Leeches"
"Старый докторский способ — помогает." = "The old doctor's remedy — it works."
"Исцеляет вас и союзников в радиусе 4." = "Heals you and allies in radius 4."
"Мор накрывает всех врагов вокруг." = "Pestilence covers every enemy around."
"Яд в радиусе 5 и страшная болезнь на 10 с." = "Poison in radius 5 and a terrible disease for 10 s."
"Корвус" = "Korvus"
"Лекарь в маске" = "the Masked Healer"
"Таинственный доктор в маске с клювом, бродящий там, где мор. Говорит сухо и по-учёному, о болезнях, лекарствах и о том, что яд и лекарство — одно и то же." = "A mysterious doctor in a beaked mask who wanders wherever plague is. Speaks dryly and learnedly, of diseases, cures and how poison and medicine are one and the same."
"Покажите язык, {player}. Хм. Жить будете. Пока." = "Show me your tongue, {player}. Hm. You'll live. For now."
"Яд и лекарство отличаются только дозой." = "Poison and medicine differ only in the dose."
"Я лечил мор в трёх городах. В двух — успешно." = "I treated the plague in three cities. In two — successfully."
"Гниль-Матушка" = "Mother Rot"
"Болотная ведьма Гниль-Матушка варит мор и шлёт его на деревни. Останови её — и я передам тебе своё ремесло." = "The bog witch Mother Rot brews plague and sends it upon the villages. Stop her — and I will pass my craft on to you."
"Матушка больше не варит. Держите маску, коллега. Лечите — и убивайте — с умом." = "Mother is brewing no more. Take the mask, colleague. Heal — and kill — wisely."
"Ртуть в крови" = "Quicksilver Blood"
"Трансмутатор" = "Transmuter"
"Превращает металлы и плоть: ртутная скорость, железный голем и золотая буря." = "Transmutes metals and flesh: quicksilver speed, an iron golem and a golden storm."
"Великое делание." = "The Great Work."
"Превращение" = "Transmutation"
"Больше золота и урон тайной магией." = "More gold and arcane damage."
"Тело становится текучим, как ртуть." = "The body becomes fluid as quicksilver."
"12 с: +30% скорости бега, +15% скорости атаки, +10% уклонения." = "12 s: +30% running speed, +15% attack speed, +10% dodge."
"Железный голем" = "Iron Golem"
"Голем из превращённого железа." = "A golem of transmuted iron."
"Железный голем на 45 с." = "An iron golem for 45 s."
"Золотая буря" = "Golden Storm"
"Вихрь расплавленного золота." = "A whirlwind of molten gold."
"Тайная магия и огонь пополам в радиусе 4." = "Arcane magic and fire in halves in radius 4."
"Фламель" = "Flamel"
"Древний алхимик" = "the Ancient Alchemist"
"Древний алхимик, нашедший философский камень и живущий уже триста лет. Говорит неспешно и загадочно, о превращениях, золоте и вечности." = "An ancient alchemist who found the philosopher's stone and has lived for three hundred years. Speaks unhurriedly and mysteriously, of transmutation, gold and eternity."
"Триста лет я жду ученика, {player}. Ты опоздал всего на двести." = "For three hundred years I have waited for a student, {player}. You are only two hundred late."
"Свинец в золото — это просто. Человека в мудреца — вот задача." = "Lead into gold is easy. A man into a sage — that is the task."
"Камень у меня есть. Нет времени им пользоваться. Ирония." = "I have the stone. I have no time to use it. Irony."
"Для великого делания нужна живая ртутная руда — её глотают твари недр. Принеси пять кусков — и я открою тебе тайну превращений." = "The Great Work needs living quicksilver ore — the creatures of the depths swallow it. Bring five pieces — and I will reveal the secret of transmutation."
"Руда живая, чудесно! Смотри и учись: всё есть всё. Ты — трансмутатор." = "The ore is alive, wonderful! Watch and learn: everything is everything. You are a transmuter."
"Ртутная руда" = "Quicksilver Ore"
"Кусок руды, по которому бегут живые капли. Нужен Фламелю." = "A lump of ore with living droplets running across it. Flamel needs it."
