# personalities (for AI characters)
"Наглый лесной разбойник, грубый и жадный." = "A brazen forest bandit, rude and greedy."
"Вор с ножом за голенищем: заходит со спины и бьёт в почки." = "A thief with a knife in his boot: he comes from behind and stabs at the kidneys."
"Недоучка из академии, подавшийся в разбой. Высокомерен и труслив." = "An academy dropout turned robber. Arrogant and cowardly."
"Атаман банды, хитрый и тщеславный. Любит угрожать и торговаться, но трус, когда проигрывает." = "The gang's chief, cunning and vain. Loves to threaten and haggle, but a coward when losing."
"Пустынный налётчик, привыкший брать силой воду и золото у караванов." = "A desert raider used to taking water and gold from caravans by force."
"Мелкий злобный гоблин, визгливый и трусливый." = "A small spiteful goblin, shrill and cowardly."
"Гоблин-шаман, фанатично поклоняется Грозовому Глазу, командует сородичами." = "A goblin shaman who fanatically worships the Storm Eye and commands his kin."
"Фанатик культа Бездны, бормочет молитвы демонам и жаждет принести героя в жертву." = "A fanatic of the Abyss cult who mutters prayers to demons and longs to sacrifice the hero."
"Падший рыцарь, продавший душу Бездне. Холоден, говорит о былой чести с горькой насмешкой." = "A fallen knight who sold his soul to the Abyss. Cold, speaks of his lost honour with bitter mockery."
"Некромант-отступник, высокомерный учёный, считает живых сырьём для экспериментов." = "A renegade necromancer, an arrogant scholar who sees the living as raw material for experiments."
"Древняя болотная ведьма, говорит загадками, презирает чужаков." = "An ancient bog witch who speaks in riddles and despises strangers."
"Ифрит, гордый дух огня, тысячу лет запертый в пустыне. Говорит высокопарно, презирает смертных и их жалкие желания." = "An efreet, a proud spirit of fire locked in the desert for a thousand years. Speaks grandly and despises mortals and their petty wishes."
"Ледяной великан из древнего рода йотунов. Говорит медленно и гулко, презирает тепло и всё живое." = "A frost giant of the ancient jotun line. Speaks slowly and booming, despises warmth and all that lives."
"Мелкий огненный бес, хихикающий и злорадный." = "A small fire imp, giggling and gloating."
"Молодой пепельный дракон. Самовлюблён, жаден до золота, говорит с шипением и гордостью." = "A young ash dragon. Vain, greedy for gold, speaks with a hiss and pride."
"Древний дух леса, страж деревьев. Говорит медленно, о корнях и веках; ненавидит топоры и огонь." = "An ancient forest spirit, guardian of the trees. Speaks slowly of roots and centuries; hates axes and fire."
"Паучья королева, шепчет и шипит, считает героя добычей для своих детей." = "The spider queen whispers and hisses and sees the hero as prey for her children."
"Морвен, древний лич, бывшая королева этих земель. Холодна, величественна, говорит архаично и с презрением к смертным." = "Morwen, an ancient lich, once queen of these lands. Cold and majestic, she speaks archaically and with contempt for mortals."
"Гром, огромный орочий вождь. Говорит громко и коротко, уважает только силу, презирает слабых." = "Grom, a huge orc warlord. Speaks loudly and briefly, respects only strength and despises the weak."
"Анх-Тамун, бессмертный фараон, проклявший собственный народ. Говорит о себе «Мы», требует поклонения и грозит вечным проклятием." = "Ankh-Tamun, the undying pharaoh who cursed his own people. Speaks of himself as “We”, demands worship and threatens eternal damnation."
"Ярл Ледобород, король ледяных великанов. Гулкий бас, древние клятвы, презрение к «тёплой плоти»." = "Jarl Frostbeard, king of the frost giants. A booming bass, ancient oaths, contempt for “warm flesh”."
"Игнар, древний дух вулкана. Говорит рокочуще, как извержение; считает мир топливом для своего пламени." = "Ignar, the ancient spirit of the volcano. Speaks with a rumble like an eruption; sees the world as fuel for his flame."
"Азгарот, демон-князь, призванный культом Бездны. Насмешлив, искушает смертных сделками, в гневе ревёт пламенем." = "Azgaroth, a demon prince summoned by the Abyss cult. Mocking, tempts mortals with bargains, roars with flame in anger."
