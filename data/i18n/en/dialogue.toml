# English: conversations with villagers, wanderers and unique characters.

# dialogue options
"Кто ты?" = "Who are you?"
"Расскажи о себе" = "Tell me about yourself"
"Как жизнь?" = "How are things?"
"Что слышно в округе?" = "What's the news around here?"
"Что слышно в мире?" = "What's the news in the world?"
"Есть работа?" = "Any work?"
"Покажи товары" = "Show me your goods"
"Прощай" = "Farewell"
"Чем я могу помочь?" = "How can I help?"
"Я выполнил твою просьбу" = "I've done what you asked"
"Напомни, что нужно сделать" = "Remind me what needs doing"
"Спасибо за всё" = "Thank you for everything"

# greetings
"Снова ты, {player}. Я ждал." = "You again, {player}. I was waiting."
"Вернулся? Хорошо." = "Back? Good."
"А, {player}. Говори." = "Ah, {player}. Speak."
"А, {player}, рад видеть." = "Ah, {player}, good to see you."
"Опять ты? Ну, заходи." = "You again? Well, come in."
"Снова ты, {player}!" = "You again, {player}!"
"{player}! Как дорога?" = "{player}! How was the road?"
"Тебе бы к знахарке, путник." = "You should see the herbalist, traveller."
"Эк тебя потрепало!" = "You've taken a beating!"
"Да ты весь в крови!" = "You're covered in blood!"
"Поздно ты гуляешь." = "You're out late."
"В такую темень добрые люди по домам сидят." = "On a night this dark good folk stay at home."
"Ночь на дворе, а ты всё бродишь." = "It's night outside and you're still wandering."
"Говорят, это ты одолел %s? Уважаю." = "They say you defeated %s? Respect."
"Говорят, это ты одолел" = "They say you defeated"
"? Уважаю." = "? Respect."
"Смотри, выбирай. Цены честные!" = "Have a look, take your pick. Honest prices!"
"Это я должен благодарить тебя." = "It's I who should thank you."
"Ступай со светом. Наши пути ещё пересекутся." = "Go with the light. Our paths will cross again."
"Мир тесен, %s. Ещё увидимся." = "It's a small world, %s. We'll meet again."
"Мир тесен," = "It's a small world,"
". Ещё увидимся." = ". We'll meet again."

# moods
"Чудища бродят у самой околицы. Страшно мне, честно скажу." = "Monsters roam right at the edge of the village. I'm scared, to be honest."
"Слышишь? Опять что-то воет за частоколом." = "Hear that? Something is howling behind the palisade again."
"Спокойный денёк выдался. Редкость по нынешним временам." = "A quiet day. A rarity these days."
"Тихо нынче, хвала небесам." = "It's quiet today, thank the heavens."
"Ночью я двери на засов запираю. И тебе советую." = "At night I bolt my doors. I advise you to do the same."
"Не люблю ночь. Мёртвые не спят." = "I don't like the night. The dead don't sleep."
"Работы невпроворот, а день короткий." = "So much work and such a short day."
"Солнце греет — уже хорошо." = "The sun is warm — that's good enough."
"Места у нас гиблые. Каждый день как последний." = "These are deadly parts. Every day could be the last."

# rumours
"Слыхал новость?" = "Heard the news?"
"Слыхал новость? %s!" = "Heard the news? %s!"
"%s отсюда, шагах в %d, есть %s — «%s». Там, говорят, %d ярусов, и на дне сидит кто-то страшный." = "%s from here, some %d steps away, there is a %s — “%s”. They say it has %d levels, and something terrible sits at the bottom."
"%s есть %s. %s" = "%s there is %s. %s"
"Ходят слухи, что %s, шагах в %d, живёт %s — %s. Говорят, награда у него за помощь такая, что и не снилась." = "Rumour has it that %s, some %d steps away, lives %s — %s. They say the reward for helping is beyond your dreams."
"Держись подальше от земель «%s». Оттуда мало кто возвращается." = "Stay away from %s. Few come back from there."
"Старики шепчут, что %s ещё жив и копит силы." = "The old folk whisper that %s is still alive and gathering strength."
"Старики шепчут, что" = "The old folk whisper that"
"ещё жив и копит силы." = "is still alive and gathering strength."
"Ничего нового, путник." = "Nothing new, traveller."
"пещера" = "cave"
"старый склеп" = "old crypt"
"ледяная пещера" = "ice cave"
"огненный провал" = "fiery chasm"
"песчаная гробница" = "sandy tomb"
"чёрная цитадель" = "black citadel"
"подземелье" = "dungeon"
"Помолишься там — и сил прибудет." = "Pray there and your strength will grow."
"Камни помнят старую войну, а в развалинах, бывает, находят клады." = "The stones remember the old war, and treasure is sometimes found in the ruins."
"Ночью туда лучше не соваться — мертвецы встают." = "Better not go there at night — the dead rise."
"Там засели разбойники. Обходи стороной." = "Bandits have holed up there. Give it a wide berth."
"Вода там чистая, а пальмы — как в сказке." = "The water is clean there, and the palms are like something out of a fairy tale."
"Странное место." = "A strange place."
"на севере" = "to the north"
"на северо-востоке" = "to the north-east"
"на востоке" = "to the east"
"на юго-востоке" = "to the south-east"
"на юге" = "to the south"
"на юго-западе" = "to the south-west"
"на западе" = "to the west"
"на северо-западе" = "to the north-west"

# quests
"%d золота" = "%d gold"
"Награда за задание: %d золота, %d опыта." = "Quest reward: %d gold, %d XP."
"Ты справился! Деревня тебе благодарна. Держи награду:" = "You did it! The village is grateful. Here is your reward:"
"Ты справился! Деревня тебе благодарна. Держи награду: %s." = "You did it! The village is grateful. Here is your reward: %s."
"уже есть задание от этого персонажа" = "you already have a quest from this character"
"слишком много заданий" = "too many quests"
"неизвестный монстр" = "unknown monster"
"Новое задание — охота: %s ×%d (награда %d золота). Журнал — J." = "New quest — hunt: %s ×%d (reward %d gold). Journal — J."
"Ты ещё не закончил: %s — %d из %d." = "You're not done yet: %s — %d of %d."
"Пока работы нет." = "No work for now."
"Сначала разберись с другими делами (" = "Deal with your other business first ("
"Сначала разберись с другими делами (%s)." = "Deal with your other business first (%s)."
"Говорят, в подземелье правит %s. Уничтожь это зло — и %d золота твои." = "They say %s rules the dungeon. Destroy that evil and %d gold is yours."
"Нас одолевают твари. Убей %d: %s — и получишь %d золота." = "Beasts are overrunning us. Kill %d: %s — and you'll get %d gold."

# trade
"Не хватает золота (нужно %d)." = "Not enough gold (you need %d)."
"Инвентарь полон!" = "Your inventory is full!"
"Куплено: %s за %d золота." = "Bought: %s for %d gold."
"Продано: %s за %d золота." = "Sold: %s for %d gold."

