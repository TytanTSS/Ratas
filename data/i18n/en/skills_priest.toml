# English: priest skills and abilities.
"Кара" = "Smite"
"Луч света в ближайшего врага." = "A beam of light at the nearest enemy."
"Малое исцеление" = "Lesser Heal"
"Лечит вас." = "Heals you."
"Исцеление" = "Heal"
"Лечит вас и союзников рядом." = "Heals you and nearby allies."
"Восстанавливает здоровье себе и союзникам рядом." = "Restores health to you and nearby allies."
"Благословение" = "Blessing"
"Божественный щит" = "Divine Shield"
"Щит света для вас и союзников рядом: сопротивление всему урону и броня." = "A shield of light for you and nearby allies: resistance to all damage and armor."
"Вам и союзникам в радиусе 3: +20% сопротивления всему урону и +4 брони на 8 с." = "You and allies within 3 steps: +20% resistance to all damage and +4 armor for 8 s."
"Вера" = "Faith"
"Свет откликается на молитву." = "The Light answers prayer."
"Благочестие" = "Piety"
"Мана и её восстановление." = "Mana and its regeneration."
"Безмятежность" = "Serenity"
"Защита от магии и сильнее свет." = "Protection from magic and stronger light."
"Праведность" = "Righteousness"
"Тьма не властна над праведным." = "Darkness has no power over the righteous."

"Священный удар" = "Holy Strike"
"Удар оружием плюс урон светом." = "A weapon blow plus holy damage."
"Приговор света" = "Judgement of Light"
"Свет перескакивает между врагами." = "Light leaps between enemies."
"Свет перескакивает на трёх врагов и снижает их сопротивление свету." = "Light leaps to three enemies and lowers their holy resistance."
"Клеймо света" = "Brand of Light"
"Клеймо света: цель становится уязвима к свету и тьме." = "A brand of light: the target becomes vulnerable to holy and shadow."
"Цель на 8 с теряет 40% сопротивления свету и 20% тьме." = "The target loses 40% holy and 20% shadow resistance for 8 s."
"Осуждён" = "Condemned"
"Освящение" = "Consecration"
"Освящает землю вокруг: свет жжёт врагов." = "Consecrates the ground around you: light burns enemies."
"Свет жжёт врагов вокруг ещё 4 с." = "Light keeps burning the enemies around for 4 s."
"Гнев небес" = "Wrath of Heaven"
"Столп света обрушивается на врагов вокруг и оглушает их." = "A pillar of light crashes down on the enemies around and stuns them."
"Мощный удар светом в радиусе 3 с оглушением." = "A mighty holy blast within 3 steps that stuns."
"Священный суд" = "Holy Judgement"
"Рвение" = "Zeal"
"Урон светом и сила молитв." = "Holy damage and the power of prayers."

"Целебный дождь" = "Healing Rain"
"Лечит вас и союзников в большом радиусе." = "Heals you and allies over a large area."
"Лечит вас и союзников в радиусе 5." = "Heals you and allies within 5 steps."
"Обновление" = "Renewal"
"Союзники рядом понемногу лечатся 10 с." = "Nearby allies heal little by little for 10 s."
"Вы и союзники в радиусе 5 восстанавливаете по 6 здоровья в секунду 10 с." = "You and allies within 5 steps regain 6 health per second for 10 s."
"Святилище" = "Sanctuary"
"Защита для всех союзников рядом." = "Protection for all nearby allies."
"Вам и союзникам в радиусе 5: +15% сопротивления всему и +3 брони на 10 с." = "You and allies within 5 steps: +15% resistance to everything and +3 armor for 10 s."
"Воскрешение" = "Resurrection"
"Воскрешает павшего союзника рядом с 40% здоровья, если тот ещё не вернулся в деревню." = "Raises a nearby fallen ally with 40% health if they have not yet returned to the village."
"Возвращает к жизни павшего союзника, если с его смерти прошло меньше минуты и он ещё не возродился." = "Brings a fallen ally back to life if less than a minute has passed since their death and they have not respawned."
"Чудо" = "Miracle"
"Огромное исцеление всех союзников вокруг." = "A huge heal for every ally around."
"Огромное исцеление вас и всех союзников в радиусе 6." = "A huge heal for you and every ally within 6 steps."
"Милосердие" = "Mercy"
"Лечение сильнее на 8% за ранг." = "Healing is 8% stronger per rank."
"Сила лечения и мана." = "Healing power and mana."
"Нимб" = "Halo"
"Здоровье и его восстановление для вас и союзников." = "Health and its regeneration for you and your allies."
"Вам и союзникам в радиусе 4: +20 к здоровью и +1 к его восстановлению на 30 с." = "You and allies within 4 steps: +20 health and +1 health regeneration for 30 s."

"Освящённое оружие" = "Consecrated Weapon"
"Оружие бьёт светом." = "The weapon strikes with light."
"+8 урона светом к каждому удару оружием на 20 с." = "+8 holy damage to every weapon blow for 20 s."
"Молот света" = "Hammer of Light"
"Удар оружием, наполненным светом." = "A blow with a weapon filled with light."
"Удар оружием и светом с оглушением на 1,2 с." = "A weapon and holy blow that stuns for 1.2 s."
"Сокрушительный удар светом с оглушением." = "A crushing holy blow that stuns."
"Натиск крестоносца" = "Crusader's Charge"
"Рывок, несущий свет и оглушение." = "A charge that brings light and a stun."
"Рывок вперёд; первый враг получает удар светом и оглушение." = "Charge forward; the first enemy takes a holy blow and a stun."
"Аура доблести" = "Aura of Valor"
"Праведная ярость." = "Righteous fury."
"Урон в ближнем бою и светом." = "Melee and holy damage."

"Стрела тьмы" = "Shadow Bolt"
"Сгусток тьмы в ближайшего врага." = "A clot of darkness at the nearest enemy."
"Агония" = "Agony"
"Долгая мучительная порча и уязвимость к тьме." = "A long, agonising blight and vulnerability to shadow."
"Тьма терзает цель 8 с и снижает её сопротивление тьме на 25%." = "Darkness torments the target for 8 s and lowers its shadow resistance by 25%."
"Проклятие слабости" = "Curse of Weakness"
"Враги вокруг теряют сопротивление всему урону и силу ударов." = "Enemies around lose resistance to all damage and the strength of their blows."
"Враги вокруг на 8 с теряют 20% сопротивления всему урону и четверть силы ударов." = "Enemies around lose 20% resistance to all damage and a quarter of their striking power for 8 s."
"Приговор" = "Sentence"
"Смертный приговор" = "Death Sentence"
"Все существа в радиусе 5 с уровнем ниже вашего умирают. Боссы теряют четверть здоровья." = "Every creature within 5 steps whose level is below yours dies. Bosses lose a quarter of their health."
"Все существа вокруг, чей уровень ниже вашего, умирают на месте. Боссы теряют четверть здоровья." = "Every creature around whose level is below yours dies on the spot. Bosses lose a quarter of their health."
"Тёмная вера" = "Dark Faith"
"Урон тьмой." = "Shadow damage."
"Родство со смертью" = "Kinship with Death"
"Тьма сильнее, чужая жизнь питает вас." = "Stronger darkness, the lives of others feed you."
