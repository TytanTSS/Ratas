"Гладиатор" = "Gladiator"
"Рыцарь" = "Knight"
"Солнечный рыцарь" = "Sun Knight"
"Мастер ядов" = "Poison Master"
"Дуэлянт" = "Duelist"
"Скаут" = "Scout"
"Трикстер" = "Trickster"
"Подражатель" = "Mimic"
"Огненный маг" = "Pyromancer"
"Ледяной маг" = "Cryomancer"
"Магический рыцарь" = "Spellblade"
