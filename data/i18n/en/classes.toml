"Ближний бой и живучесть. Подклассы: Страж, Гладиатор, Рыцарь." = "Melee and endurance. Subclasses: Guardian, Gladiator, Knight."
"Быстрые выпады и подвижность. Подклассы: Мастер ядов, Дуэлянт, Скаут, Трикстер." = "Quick lunges and mobility. Subclasses: Poison Master, Duelist, Scout, Trickster."
"Магия стихий и массовые заклинания. Подклассы: Огненный маг, Ледяной маг, Магический рыцарь." = "Elemental magic and mass spells. Subclasses: Pyromancer, Cryomancer, Spellblade."
"Служение богу: исцеление и усиление себя и союзников. Подклассы: Судья, Святой, Воитель." = "Serving a god: healing and strengthening yourself and your allies. Subclasses: Judge, Saint, Templar."
"Секретный класс. Говорит с бурей и духами предков. Подклассы: Повелитель бурь, Хранитель духов." = "Secret class. Speaks with the storm and the spirits of the ancestors. Subclasses: Stormcaller, Spirit Keeper."
"Секретный класс. Сделки с бездной, проклятия и демоны. Подклассы: Проклинатель, Демонолог." = "Secret class. Deals with the abyss, curses and demons. Subclasses: Hexer, Demonologist."

"Защита и живучесть, провокация врагов на себя. Многие навыки требуют щит." = "Defence and endurance, drawing enemies onto yourself. Many skills need a shield."
"Сила, которая растёт вместе с ранами. Навыки требуют двуручное оружие или два оружия." = "Strength that grows with your wounds. Skills need a two-handed weapon or two weapons."
"Равновесие силы и стойкости. Навыкам нужно лишь оружие в руках." = "A balance of strength and toughness. Skills only need a weapon in hand."
"Испепеляет врагов божественным светом: удары разом наносят физический урон, урон светом и огнём. Сильнее прочих путей воина." = "Burns enemies to ash with divine light: blows deal physical, holy and fire damage at once. Stronger than the other warrior paths."
"Яды, порча и проклятые клинки." = "Poisons, blight and cursed blades."
"Бой один на один: серии ударов по одной цели." = "Single combat: chains of blows against one target."
"Луки и арбалеты, бой на расстоянии." = "Bows and crossbows, fighting at range."
"Иллюзии, невидимость и удар в спину, пока враг отвлечён обманкой." = "Illusions, invisibility and a stab in the back while the enemy is distracted by a decoy."
"Копирует умения врагов. Копия чуть слабее оригинала и зависит от уровня врага и вашего." = "Copies enemy abilities. A copy is a little weaker than the original and depends on the enemy's level and yours."
"Огромный урон огнём по площади ценой большого расхода маны." = "Huge fire damage over an area at the cost of a lot of mana."
"Средний урон льдом, замедление и ослабление атак. Средний расход маны." = "Medium ice damage that slows enemies and their attacks. Medium mana cost."
"Ближний бой, усиленный магией: стихии добавляются к ударам оружия. Средний расход маны." = "Melee empowered by magic: the elements join your weapon blows. Medium mana cost."
"Запечатывает умения врагов: под печатью они не могут колдовать." = "Seals enemy abilities: under a seal they cannot cast."
"Исцеление и усиление, а также кара: средний урон святым светом." = "Healing and blessings, and punishment too: medium holy damage."
"Сильнейшее лечение и благословения, воскрешение павших союзников в течение минуты." = "The strongest healing and blessings, raising fallen allies within a minute."
"Ближний бой с благословлённым оружием и удары святым светом." = "Melee with a blessed weapon and strikes of holy light."
"Отрёкся от света ради тьмы: урон тьмой, ослабление сопротивлений и приговор, убивающий всех существ слабее вас." = "Renounced the light for darkness: shadow damage, weakened resistances and a sentence that kills every creature weaker than you."
"Цепные молнии и грозы." = "Chain lightning and thunderstorms."
"Духи предков лечат и защищают, призрачные волки сражаются рядом." = "Ancestral spirits heal and protect, spirit wolves fight at your side."
"Проклятия, обрекающие врагов на медленную смерть." = "Curses that doom enemies to a slow death."
"Призывает бесов и стражей бездны." = "Summons imps and guardians of the abyss."

"Основы ближнего боя и выживания." = "The basics of melee and survival."
"Точность, скорость и уклонение." = "Precision, speed and evasion."
"Мана, тайные чары и защита." = "Mana, arcane charms and protection."
"Молитвы, исцеление и благословения." = "Prayers, healing and blessings."
"Буря и духи." = "Storm and spirits."
"Тьма и похищение жизни." = "Darkness and life drain."
"Щит, провокация и несокрушимость." = "Shield, taunts and steadfastness."
"Ярость, кровь и тяжёлое оружие." = "Rage, blood and heavy weapons."
"Выучка, честь и тактика." = "Training, honour and tactics."
"Пламя рассвета в каждом ударе." = "The flame of dawn in every blow."
"Яды и проклятые клинки." = "Poisons and cursed blades."
"Серии ударов и добивания." = "Combos and finishing blows."
"Стрельба из луков и арбалетов." = "Shooting bows and crossbows."
"Иллюзии, невидимость, удар в спину." = "Illusions, invisibility, a stab in the back."
"Чужие умения в своих руках." = "Other people's abilities in your hands."
"Огонь, пожирающий всё вокруг." = "Fire that devours everything around."
"Холод, сковывающий врагов." = "Cold that binds enemies."
"Клинок, заряженный стихиями." = "A blade charged with the elements."
"Печати, лишающие врагов магии." = "Seals that strip enemies of magic."
"Суд света над нечистью." = "The judgement of light upon the unclean."
"Исцеление, защита и воскрешение." = "Healing, protection and resurrection."
"Благословлённое оружие." = "Blessed weapons."
"Тьма, порча и смертный приговор." = "Darkness, blight and a death sentence."
"Молнии и грозы." = "Lightning and thunderstorms."
"Исцеление и призрачные волки." = "Healing and spirit wolves."
"Проклятия и рок." = "Curses and doom."
"Призыв демонов." = "Summoning demons."
"Общие умения любого странника, доступны всем." = "Common skills of any wanderer, open to everyone."
"Навыки, которым учат лишь уникальные мастера этого мира." = "Skills taught only by the unique masters of this world."
