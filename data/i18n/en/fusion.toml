# English: fusion of abilities of different classes (content/fusion.rs, game/fusion.rs, the fusion window U).

# what a fusion gives
"Одно применение — срабатывают оба умения: «%s» и «%s»." = "One cast — both abilities fire: “%s” and “%s”."
"Сначала рывок «%s», затем «%s» — уже с нового места." = "First the dash “%s”, then “%s” — from the new spot."
"Резонанс стихии «%s»: обе части сильнее на %s%%." = "Resonance of %s: both parts are %s%% stronger."
"Двойная стихия: урон обеих частей делится между «%s» и «%s» — врагу труднее защититься." = "Dual element: both parts split their damage between %s and %s — harder for the enemy to resist."
"Зачарование: «%s» бьёт стихией «%s»." = "Enchantment: “%s” strikes with %s."
"Общий эффект «%s» берёт лучшее от обеих частей." = "The shared effect “%s” takes the best of both parts."
"Попадания обеих частей накладывают сразу «%s» и «%s»." = "Hits of both parts apply “%s” and “%s” at once."
"«%s» теперь тоже накладывает «%s»." = "“%s” now applies “%s” too."
"Вампиризм %s%% у обеих частей." = "Life leech %s%% on both parts."
"Живительная сила: «%s» лечит вас на %s%% нанесённого урона." = "Life-giving force: “%s” heals you for %s%% of the damage dealt."
"Добивание: «%s» сильнее бьёт раненых врагов." = "Finisher: “%s” hits wounded enemies harder."
"Удар в спину ×%s у обеих частей." = "Backstab ×%s on both parts."

# what a fusion costs
"Рассеивание силы: урон и лечение каждой части слабее на %s%%." = "Dispersed power: damage and healing of each part are %s%% weaker."
"Расход маны %s вместо %s за оба умения порознь." = "Costs %s mana instead of %s for both abilities apart."
"Перезарядка %s с — дольше, чем у каждой части (%s с и %s с)." = "Cooldown %s s — longer than either part (%s s and %s s)."
"Действие «%s» короче: %s с вместо %s с." = "“%s” lasts less: %s s instead of %s s."
"Нужно снаряжение обеих частей: %s и %s." = "Needs the gear of both parts: %s and %s."
"Противоборство стихий «%s» и «%s»: шанс срыва +%s%%, отдача %s%% здоровья." = "Clash of %s and %s: +%s%% chance to fizzle, a backlash of %s%% health."
"Отдача: каждое применение отнимает 6% здоровья." = "Backlash: every cast takes 6% of your health."
"Нестабильность: с шансом 12% слияние срывается — мана и перезарядка тратятся впустую." = "Instability: a 12% chance the fusion fizzles — the mana and the cooldown are wasted."
"Истощение: после применения 4 с вы бегаете на 30% медленнее." = "Exhaustion: for 4 s after a cast you run 30% slower."
"Уязвимость: после применения 5 с у вас −15% сопротивления всему урону и −6 брони." = "Vulnerability: for 5 s after a cast you have −15% resistance to all damage and −6 armor."
"Оцепенение: после применения 5 с вы атакуете на 35% медленнее." = "Numbness: for 5 s after a cast you attack 35% slower."
"Истощение" = "Exhaustion"
"Уязвимость" = "Vulnerability"
"Оцепенение" = "Numbness"
"Слияние умений «%s» и «%s»: оба срабатывают одним применением." = "A fusion of “%s” and “%s”: both fire with one cast."

# the rules and the log
"нет такого умения" = "no such ability"
"умение «%s» не изучено" = "the ability “%s” is not learned"
"слитое умение нельзя слить ещё раз" = "a fused ability cannot be fused again"
"умение «%s» не сливается" = "the ability “%s” does not fuse"
"умение «%s» не принадлежит ни одному классу" = "the ability “%s” belongs to no class"
"слияние доступно с %d-го уровня" = "fusion is available from level %d"
"все слоты слияния заняты (%d из %d); новый откроется на %d-м уровне" = "all fusion slots are taken (%d of %d); the next opens at level %d"
"выберите два разных умения" = "choose two different abilities"
"оба умения из класса «%s» — нужны умения разных классов" = "both abilities are of the class “%s” — abilities of different classes are needed"
"несовместимое снаряжение: %s и %s" = "incompatible gear: %s and %s"
"Слияние невозможно: %s." = "Cannot fuse: %s."
"Умения слились в одно: «%s». Разделить их можно в окне слияния (U)." = "The abilities merged into one: “%s”. They can be split in the fusion window (U)."
"Слияние распалось: «%s» и «%s» снова отдельные умения." = "The fusion came apart: “%s” and “%s” are separate abilities again."
"«%s» срывается: сила рассеялась впустую." = "“%s” fizzles: the power scattered in vain."
"Теперь умения разных классов можно сливать в одно — окно слияния (U)." = "Abilities of different classes can now be fused into one — the fusion window (U)."
"Открыт новый слот слияния умений: теперь их %d (U)." = "A new ability fusion slot is open: %d now (U)."
"Слияние!" = "Fusion!"
"срыв!" = "fizzle!"
"-%d отдача" = "-%d backlash"

# the fusion window
"Слияние умений" = "Ability fusion"
"Слияния: %d из %d" = "Fusions: %d of %d"
"Без класса — не сливаются" = "No class — do not fuse"
"Слияние откроется на %d-м уровне." = "Fusion opens at level %d."
"Свободно слотов: %d — новый каждые %d уровней." = "Free slots: %d — a new one every %d levels."
"Шанс срыва %.0f%%" = "Chance to fizzle %.0f%%"
"Отдача %.0f%% здоровья" = "Backlash %.0f%% health"
"После применения:" = "After a cast:"
"Преимущества" = "Strengths"
"Недостатки" = "Drawbacks"
"Разделить [Delete]" = "Split [Delete]"
"Слить [Пробел]" = "Fuse [Space]"
"Умения исчезнут с панели и станут одним; разделить их можно в этом окне." = "The abilities leave the hotbar and become one; they can be split in this window."
"Не сливается:" = "Does not fuse:"
"Выберите два умения разных классов (Enter или щелчок) — здесь появится их слияние: одно умение, которое делает то же, что оба, с их общими преимуществами и платой за них: больше маны, дольше перезарядка, слабее части и свой изъян." = "Choose two abilities of different classes (Enter or a click) — their fusion appears here: one ability that does what both do, with their shared strengths and the price for them: more mana, a longer cooldown, weaker parts and a flaw of its own."
"↑↓ выбор • Enter / щелчок — взять умение • Пробел — слить • Delete — разделить слияние или очистить выбор • Esc" = "↑↓ select • Enter / click — take an ability • Space — fuse • Delete — split a fusion or clear the choice • Esc"
"←→ / щелчок — вкладка • ↑↓ выбор • 1-6 назначить на панель • U — слияние умений • Esc" = "←→ / click — tab • ↑↓ select • 1-6 put on the hotbar • U — ability fusion • Esc"
"слияние двух умений разных классов в одно" = "fuse two abilities of different classes into one"
"Слияние (U): два умения разных классов становятся одним, которое делает то же, что оба, — но тратит больше маны, дольше перезаряжается, его части слабее и у него есть свой изъян. Слот слияния — каждые 5 уровней; слияние можно разделить." = "Fusion (U): two abilities of different classes become one that does what both do — but it costs more mana, recharges longer, its parts are weaker and it has a flaw of its own. A fusion slot every 5 levels; a fusion can be split."
