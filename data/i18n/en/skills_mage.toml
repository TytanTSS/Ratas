# English: mage skills and abilities.
"Магическая стрела" = "Magic Missile"
"Сгусток магии летит в ближайшего врага." = "A clot of magic flies at the nearest enemy."
"Скачок" = "Blink"
"Мгновенный перенос на несколько шагов вперёд." = "Instantly carries you a few steps forward."
"Перенос на 6 шагов в направлении взгляда." = "Teleports 6 steps in the direction you face."
"Магический барьер" = "Magic Barrier"
"Барьер гасит часть любого урона." = "A barrier absorbs part of any damage."
"+25% сопротивления всему урону на 6 с." = "+25% resistance to all damage for 6 s."
"Мудрость" = "Wisdom"
"Сила заклинаний и мана." = "Spell power and mana."
"Тайный разум" = "Arcane Mind"
"Запас маны." = "A reserve of mana."
"Медитация" = "Meditation"
"Восстановление маны." = "Mana regeneration."
"Чародейский оберег" = "Spell Ward"
"Защитные чары от магии и стихий." = "Protective charms against magic and the elements."
"Знание рун" = "Rune Lore"
"Сила заклинаний и защита от магии." = "Spell power and protection from magic."

"Огненный шар" = "Fireball"
"Взрывающийся шар огня, поджигает врагов." = "An exploding ball of fire that sets enemies alight."
"Взрывается при попадании и поджигает." = "Explodes on impact and sets on fire."
"Огненная волна" = "Fire Wave"
"Кольцо огня вокруг вас." = "A ring of fire around you."
"Огонь по всем врагам в радиусе 3." = "Fire on every enemy within 3 steps."
"Метеор" = "Meteor"
"Огромный огненный камень с небес." = "A huge fiery stone from the sky."
"Гигантский взрыв огня." = "A gigantic explosion of fire."
"Преисподняя" = "Inferno"
"Пламя на пять шагов вокруг и сильное горение." = "Flames five steps around and fierce burning."
"Всё вокруг на пять шагов охвачено пламенем. Очень дорого." = "Everything within five steps is engulfed in flame. Very expensive."
"Адский огонь" = "Hellfire"
"Возгорание" = "Ignition"
"Чаще критический урон, сильнее пламя." = "More frequent critical hits, stronger flames."
"Повелитель огня" = "Master of Fire"
"Урон огнём." = "Fire damage."

"Ледяное копьё" = "Ice Lance"
"Пронзающий осколок льда с замедлением." = "A piercing shard of ice that slows."
"Сильный удар холодом с замедлением." = "A strong cold strike that slows."
"Ледяная волна" = "Frost Wave"
"Ранит и замедляет врагов вокруг." = "Wounds and slows the enemies around."
"Холод вокруг вас ранит и замедляет врагов." = "Cold around you wounds and slows enemies."
"Метель" = "Blizzard"
"Буран на большой площади: урон и сильное замедление." = "A snowstorm over a large area: damage and a strong slow."
"Ледяной доспех" = "Ice Armor"
"Лёд защищает и ранит атакующих." = "Ice protects you and wounds attackers."
"15 с: +6 брони, +30% сопротивления холоду, атакующие ранятся о лёд." = "15 s: +6 armor, +30% cold resistance, attackers are cut by the ice."
"Стужа" = "Deep Cold"
"Холод в радиусе 3: враги сильно замедлены и бьют реже." = "Cold within 3 steps: enemies are greatly slowed and strike less often."
"Вечная мерзлота" = "Permafrost"
"Холод сильнее, мана восстанавливается быстрее." = "Stronger cold, faster mana regeneration."
"Повелитель льда" = "Master of Ice"
"Урон холодом и стойкость к нему." = "Cold damage and resistance to it."

"Чародейский клинок" = "Arcane Blade"
"Удар оружием плюс урон тайной магией." = "A weapon blow plus arcane damage."
"Удар заклинанием" = "Spellstrike"
"Удар оружием, в который вложено заклинание." = "A weapon blow with a spell put into it."
"Пылающий клинок" = "Flaming Blade"
"Оружие пылает: удары наносят урон огнём." = "The weapon blazes: blows deal fire damage."
"+8 урона огнём к каждому удару оружием на 20 с." = "+8 fire damage to every weapon blow for 20 s."
"Ледяной клинок" = "Frost Blade"
"Оружие покрыто инеем: удары наносят урон холодом." = "The weapon is covered in frost: blows deal cold damage."
"+7 урона холодом к каждому удару оружием на 20 с." = "+7 cold damage to every weapon blow for 20 s."
"Грозовой клинок" = "Storm Blade"
"Оружие искрит: удары наносят урон молнией." = "The weapon sparks: blows deal lightning damage."
"+9 урона молнией к каждому удару оружием на 20 с." = "+9 lightning damage to every weapon blow for 20 s."
"Ярость стихий" = "Elemental Fury"
"Круговой удар огнём, холодом и молнией разом." = "A sweeping blow of fire, cold and lightning at once."
"Огонь, холод и молния по всем врагам в радиусе 2 вместе с ударом оружия." = "Fire, cold and lightning on every enemy within 2 steps along with a weapon blow."
"Знак стихий" = "Mark of the Elements"
"Клеймо на врагах вокруг: их сопротивление огню, холоду и молнии падает на 30%." = "Brands the enemies around: their fire, cold and lightning resistance drops by 30%."
"Враги вокруг на 8 с теряют 30% сопротивления огню, холоду и молнии." = "Enemies around lose 30% fire, cold and lightning resistance for 8 s."
"Маг, привычный к ближнему бою." = "A mage used to close combat."
"Удары и заклинания сильнее." = "Stronger blows and spells."

"Печать" = "Seal"
"Запечатывает умения врага на 5 с." = "Seals an enemy's abilities for 5 s."
"Цель 5 с не может применять умения." = "The target cannot use abilities for 5 s."
"Сковывающая печать" = "Binding Seal"
"Печать, которая заодно приковывает врага к месту." = "A seal that also chains the enemy in place."
"4 с без умений и почти без движения." = "4 s without abilities and almost without moving."
"Поле пустоты" = "Void Field"
"Запечатывает всех врагов вокруг." = "Seals every enemy around."
"Все враги в радиусе 3 на 3 с запечатаны." = "Every enemy within 3 steps is sealed for 3 s."
"Великая печать" = "Great Seal"
"Долгая печать на всех вокруг цели, их защита слабеет." = "A long seal on everyone around the target, their defences weaken."
"Враги в радиусе 2 на 8 с запечатаны и теряют 20% сопротивления всему." = "Enemies within 2 steps are sealed for 8 s and lose 20% resistance to everything."
"Мастер печатей" = "Seal Master"
