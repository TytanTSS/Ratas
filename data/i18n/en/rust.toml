"Урон: 10 типов — рубящий, колющий, дробящий, огонь, холод, молния, яд, тайная магия, свет, тьма. Броня гасит только физический урон, остальное — сопротивления (C). Справа видно, к чему цель стойка и уязвима." = "Damage: 10 types — slashing, piercing, crushing, fire, cold, lightning, poison, arcane, light, darkness. Armor stops only physical damage, the rest is up to resistances (C). The target frame shows what the enemy resists and fears."
"Классы: на 5-м уровне класса выбирается подкласс; с 5-го уровня героя можно начать второй класс (K → «+ Класс»). Секретные классы и подклассы дают уникальные персонажи." = "Classes: at class level 5 you choose a subclass; from hero level 5 you can start a second class (K → “+ Class”). Secret classes and subclasses are taught by unique characters."
"Мир: у каждого региона свой нрав — пустыня, тундра, пепел, проклятые земли опаснее. Вне деревень игроки могут напасть друг на друга — группа (G) защищает своих. Павшего героя можно воскресить в течение минуты." = "World: every region has its temper — desert, tundra, ash and cursed lands are more dangerous. Outside villages players may attack each other — a party (G) protects its own. A fallen hero can be revived within a minute."
"Диалоги: варианты ответа — мышью или цифрами; при включённом ИИ можно писать персонажу что угодно и нажать Enter." = "Dialogues: pick answers with the mouse or digits; with AI on you can write anything to a character and press Enter."
