"Цепная молния" = "Chain Lightning"
"Устрашающий рёв" = "Terrifying Roar"
"Падающая звезда" = "Falling Star"
"Похищение души" = "Soul Drain"
"Неистовство" = "Frenzy"
"Зов мёртвых" = "Call of the Dead"
"Врата преисподней" = "Hellgate"
"Зов вьюги" = "Call of the Blizzard"
"Рой скарабеев" = "Scarab Swarm"
"Подгорная дружина" = "Under-Mountain Retinue"
"Обморожение" = "Frostbite"
"Чума" = "Plague"
"Чумное облако" = "Plague Cloud"
"Ужас" = "Terror"

# creatures of the dangerous lands
"Лютоволк" = "Dire Wolf"
"Огр" = "Ogre"
"Огр-людоед: тупой, голодный и уверенный, что всё вокруг съедобно." = "A man-eating ogre: dim, hungry and sure that everything around is edible."
"Кентавр-налётчик" = "Centaur Raider"
"Кентавр из степной орды: гордый, быстрый, презирает двуногих." = "A centaur of the steppe horde: proud, swift, contemptuous of two-legged folk."
"Болотный ужас" = "Bog Horror"
"Виверна" = "Wyvern"
"Ледяной тролль" = "Frost Troll"
"Адская гончая" = "Hellhound"
"Рыцарь смерти" = "Death Knight"
"Рыцарь, продавший душу ради вечной службы. Говорит холодно и коротко, презирает живых." = "A knight who sold his soul for eternal service. Speaks coldly and briefly, despises the living."
"Царский скорпион" = "Royal Scorpion"
"Каменный голем" = "Stone Golem"
"Ледяной призрак" = "Ice Wraith"
"Вампир" = "Vampire"
"Древний вампир: учтивый, насмешливый, жаждущий крови героев." = "An ancient vampire: courteous, mocking, thirsting for the blood of heroes."
"Исчадие бездны" = "Pit Fiend"
"Страж-шакал" = "Jackal Guardian"

# creatures for a party
"Каменный великан" = "Stone Giant"
"Каменный великан с гор: медлительный, древний, ненавидит шум и чужаков." = "A stone giant of the mountains: slow, ancient, hating noise and strangers."
"Болотная гидра" = "Swamp Hydra"
"Огненный великан" = "Fire Giant"
"Огненный великан из пепельных пустошей. Ревёт, как пламя в горне, и смеётся над смертными." = "A fire giant of the ashen wastes. Roars like flame in a forge and laughs at mortals."
"Песчаный колосс" = "Sand Colossus"
"Мерзость" = "Abomination"
"Сшитая некромантами туша из десятка тел. Бормочет чужими голосами." = "A hulk stitched by necromancers from a dozen bodies. Mutters in other people's voices."
"Медведь-оборотень" = "Werebear"
"Проклятый охотник, обратившийся медведем. В рёве ещё слышен человеческий голос." = "A cursed hunter turned bear. A human voice still sounds in its roar."
"Мамонт" = "Mammoth"

# lords of the lairs
"Король огров Гургл" = "Gurgl, King of Ogres"
"Гургл, король огров. Хвастлив, прожорлив, считает себя величайшим воином мира и требует дань едой." = "Gurgl, king of the ogres. Boastful and gluttonous, he thinks himself the greatest warrior in the world and demands tribute in food."
"Древо-праотец" = "Elder Treant"
"Древнейшее дерево леса, помнящее мир без людей. Говорит медленно и гневается на тех, кто рубит лес." = "The oldest tree of the forest, who remembers the world without people. Speaks slowly and rages at those who fell the woods."
"Праматерь гидр" = "Hydra Matriarch"
"Многоглавая праматерь гидр. Её головы спорят друг с другом шипящими голосами." = "The many-headed mother of hydras. Her heads argue with each other in hissing voices."
"Песчаный царь Шахр" = "Shahr, the Sand King"
"Шахр, царь затонувшего в песках города. Высокомерен, говорит о себе во множественном числе." = "Shahr, king of a city sunk in the sands. Haughty, he speaks of himself as \"we\"."
"Ледяной змей Хримтурс" = "Hrimthurs, the Frost Wyrm"
"Хримтурс, древний ледяной змей. Холоден и неспешен, зовёт героев «тёплым мясом»." = "Hrimthurs, an ancient frost wyrm. Cold and unhurried, he calls heroes \"warm meat\"."
"Король-мертвец Дрегор" = "Dregor, the Dead King"
"Дрегор, павший король, поднявший своё войско из могил. Говорит торжественно, будто ещё правит." = "Dregor, a fallen king who raised his army from the graves. Speaks solemnly, as though he still reigns."
"Древний дракон Ауреос" = "Aureos, the Ancient Dragon"
"Ауреос, последний из древних драконов. Мудр, горд и смертельно опасен; презирает героев, но уважает отвагу." = "Aureos, the last of the ancient dragons. Wise, proud and deadly; he despises heroes but respects courage."

# lords of the strongholds
"Подгорный король Торгрим" = "Torgrim, the Under-Mountain King"
"Торгрим, король троллей под горами. Грубый, громогласный, гордится тем, что съел трёх героев." = "Torgrim, king of the trolls under the mountains. Rude and loud, proud of having eaten three heroes."
"Король-лич Велимир" = "Velimir, the Lich King"
"Велимир, некогда великий чародей, ставший королём-личом. Говорит вежливо и устало, как тот, кто видел конец тысячи героев." = "Velimir, once a great sorcerer, now a lich king. Speaks politely and wearily, like one who has seen the end of a thousand heroes."
"Владычица Вечной Зимы" = "Mistress of Eternal Winter"
"Владычица Вечной Зимы, дух ледника. Говорит тихо и холодно, обещает героям вечный покой во льду." = "The Mistress of Eternal Winter, spirit of the glacier. Speaks softly and coldly, promising heroes eternal rest in the ice."
"Сурт, Огненный титан" = "Surt, the Fire Titan"
"Сурт, огненный титан из сердца вулкана. Говорит раскатами грома, жаждет сжечь мир дотла." = "Surt, the fire titan from the heart of the volcano. Speaks in peals of thunder and longs to burn the world to ashes."
"Аватар Забытого бога" = "Avatar of the Forgotten God"
"Воплощение бога, которого забыли люди. Требует поклонения, гневно карает святотатцев." = "The incarnation of a god people have forgotten. Demands worship and wrathfully punishes the sacrilegious."
"Велиал, Владыка Бездны" = "Belial, Lord of the Abyss"
"Велиал, владыка Бездны, старший над Азгаротом. Говорит вкрадчиво, предлагает героям власть в обмен на души." = "Belial, lord of the Abyss, Azgaroth's master. Speaks silkily, offering heroes power in exchange for their souls."

# squads
"Ватага огров" = "Ogre Band"
"Кентаврова орда" = "Centaur Horde"
"Легион смерти" = "Death Legion"
"Адская свора" = "Hell Pack"
"Ледяная орда" = "Frost Horde"
"Стража гробниц" = "Tomb Watch"

# trophies
"Чешуя Ауреоса" = "Scale of Aureos"
"Кираса из чешуи последнего древнего дракона. Огонь ей не страшен." = "A cuirass of the last ancient dragon's scales. Fire holds no fear for it."
"Корона Торгрима" = "Crown of Torgrim"
"Тяжёлый железный венец подгорного короля, помятый о головы героев." = "The heavy iron crown of the under-mountain king, dented on the heads of heroes."
"Гримуар Велимира" = "Velimir's Grimoire"
"Последние заклинания великого чародея. Страницы шепчут, когда их листают." = "The last spells of a great sorcerer. The pages whisper when turned."
"Венец Вечной Зимы" = "Circlet of Eternal Winter"
"Ледяной венец, который не тает даже в огне." = "An icy circlet that does not melt even in fire."
"Сердце Сурта" = "Heart of Surt"
"Остывший уголь из груди титана. Всё ещё обжигает пальцы." = "A cooled ember from the titan's chest. It still burns the fingers."
"Солнечный диск" = "Sun Disc"
"Золотой диск с алтаря забытого бога. Светится в темноте." = "A golden disc from the altar of a forgotten god. It glows in the dark."
"Рога Велиала" = "Horns of Belial"
"Клинок, выкованный из рога владыки Бездны. Пьёт кровь и души." = "A blade forged from the horn of the Abyss lord. It drinks blood and souls."
