# English: the belts of danger, the creatures of the dangerous and deadly lands, their strongholds.

# belts of danger
"Мирный край" = "Peaceful Lands"
"Пограничье" = "Borderlands"
"Дикие земли" = "Wildlands"
"Опасные земли" = "Perilous Lands"
"Гиблые земли" = "Deadlands"
"Земли для новичков: слабые звери и разбойники, элитных врагов нет." = "Lands for newcomers: weak beasts and bandits, no elite foes."
"Здесь хозяйничают отряды и элитные враги со свитой." = "Squads and elite foes with their retinues rule here."
"Дикие земли: сильные звери, глубокие подземелья, одиночке надо быть начеку." = "Wildlands: strong beasts and deep dungeons; a lone hero must stay alert."
"Здесь бродят чудища, которых не одолеть в одиночку: ходите группой." = "Creatures roam here that no one can defeat alone: travel in a party."
"Твердыни и владыки этих мест по силам лишь группе героев 20–30 уровня." = "The strongholds and lords of these lands yield only to a party of level 20–30 heroes."
"Вы вступаете в земли: %s (ур. %s)." = "You enter the %s (lv. %s)."
"Вы возвращаетесь в земли: %s (ур. %s)." = "You return to the %s (lv. %s)."
"Ваш уровень (%d) слишком мал для этих земель: здешние чудища сильнее." = "Your level (%d) is too low for these lands: the creatures here are stronger."
"Это твердыня: её стражи и владыка по силам лишь группе из %d+ героев." = "This is a stronghold: its guards and lord yield only to a party of %d+ heroes."
"Для группы: %d+" = "For a party: %d+"
"Пояса опасности" = "Belts of danger"

