# English: the quick-access bar and the controls window (play/controls.rs, play/keys.rs).

# the controls window
"Управление" = "Controls"
"Сколько ячеек на панели быстрого доступа и какие клавиши их нажимают. Ряд ячеек, который не помещается по ширине экрана, переносится выше." = "How many cells the quick-access bar has and which keys press them. A row of cells that does not fit the width of the screen moves up."
"Ячеек на панели" = "Cells on the bar"
"Ячейка" = "Cell"
"Ячейка %d" = "Cell %d"
"Умение" = "Ability"
"Клавиша" = "Key"
"Вторая клавиша" = "Second key"
"пусто" = "empty"
"нажмите клавишу…" = "press a key…"
"Нажмите клавишу или кнопку мыши (ПКМ, СКМ). Delete — убрать, Esc — отмена." = "Press a key or a mouse button (RMB, MMB). Delete — remove, Esc — cancel."
"Клавиша %s перенесена: «%s» → «%s»." = "The key %s moved: “%s” → “%s”."
"клавиша снята" = "key removed"
"Клавиши по умолчанию" = "Default keys"
"Все клавиши — как по умолчанию." = "All keys are back to the defaults."
"Готово" = "Done"
"↑↓ выбор • ←→ число ячеек / столбец • Enter / щелчок — назначить клавишу • Delete — убрать • Esc — закрыть" = "↑↓ select • ←→ number of cells / column • Enter / click — assign a key • Delete — remove • Esc — close"
"Клавиша {n} занята: {what}." = "The key {n} is taken: {what}."
"Эту клавишу назначить нельзя." = "This key cannot be assigned."
"СКМ" = "MMB"

