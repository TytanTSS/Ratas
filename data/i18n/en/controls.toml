# the bar
"Клавиши:" = "Keys:"
"Клавиша не назначена (Esc → Управление)." = "No key assigned (Esc → Controls)."
"Пусто: в окне навыков (K) выберите умение и нажмите клавишу этой ячейки." = "Empty: choose an ability in the skills window (K) and press this cell's key."
"Управление\nЧисло ячеек панели и их клавиши." = "Controls\nThe number of bar cells and their keys."

# keys in other windows
"←→ / щелчок — вкладка • ↑↓ выбор • клавиша ячейки — поставить на панель • U — слияние умений • Esc" = "←→ / click — tab • ↑↓ select • a cell's key — put on the bar • U — ability fusion • Esc"
"←→ вкладка • ↑↓ выбор • Enter / двойной щелчок — изучить, выбрать • клавиша ячейки — на панель • Esc" = "←→ tab • ↑↓ select • Enter / double click — learn, choose • a cell's key — on the bar • Esc"
"1–9, 0, ПКМ" = "1–9, 0, RMB"
"ячейки панели в сторону курсора; их число и клавиши — Esc → «Управление»" = "the bar's cells toward the cursor; their number and keys — Esc → “Controls”"
"выпить зелье здоровья / маны (тоже меняются в «Управлении»)" = "drink a health / mana potion (also changed in “Controls”)"
