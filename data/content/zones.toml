# Опасные и Гиблые земли: обитатели дальних поясов мира и их твердыни.
#
# min_level — с какого уровня земли (или этажа подземелья) существо водится: в Мирном крае и
# Пограничье их нет. party — сколько героев нужно, чтобы его одолеть: у такого чудища в
# 2,5·party раза больше здоровья, а его удары на 15% сильнее за каждого героя (см. README).
# Владыки (elite) живут в логовах и не уходят; хозяева твердынь (boss) ждут на последнем
# этаже подземелий Гиблых земель и зовут свиту.

