# Предметы. kind — слот или вид предмета:
#   weapon (правая рука; hands = 2 — двуручное, занимает и левую), shield и offhand (левая рука),
#   head, chest, belt, legs, back, ring (4 слота), consumable, quest (предметы заданий), gold.
# Одноручное оружие можно взять и в левую руку — получится бой с двумя оружиями.
# weapon — тип оружия, look — как вещь выглядит на герое в графическом режиме.
# depth — с какой глубины подземелья предмет выпадает, weight — частота (0 = только из особых мест).

