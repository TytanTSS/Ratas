# Уникальные персонажи мира. В каждом мире появляется их часть — в случайных местах подходящих
# биомов (biomes). Каждый даёт одно задание:
#   slay   — убить чемпиона: усиленного монстра target с именем champion, он появится далеко в глуши;
#   boss   — сразить босса подземелья target;
#   relics — принести count предметов target, их роняют монстры из sources (биомы и темы подземелий).
# reward — награда: item:<предмет>, class:<секретный класс>, subclass:<секретный подкласс>, skill:<тайный навык>.

[[uniques]]
key = "aurelius"
name = "Аурелий"
title = "Отшельник рассвета"
color = "#ffc040"
model = "sun_hermit"
persona = "Седой отшельник, поклоняющийся солнцу. Говорит торжественно, о свете, пламени и рассвете; когда-то был рыцарем ордена Солнца, ныне последний его хранитель."
greeting = "Ты пришёл с востока или с запада, {player}? Неважно. Солнце видит всех."
about = [
  "Я последний рыцарь ордена Солнца. Мы сжигали тьму светом и пламенем разом.",
  "Наш орден пал, но его путь можно передать достойному воину.",
]
biomes = ["desert", "hills", "plains"]
quest = "relics"
target = "sun_shard"
count = 5
sources = ["desert", "ash", "volcano", "temple"]
offer = "Огненные твари пустынь и пепелищ хранят осколки павшего солнца. Принеси мне пять — и я открою тебе путь Солнечного рыцаря."
done = "Осколки поют... Ты достоин. Отныне свет и пламя — твоё оружие, Солнечный рыцарь."
reward = "subclass:sun_knight"

[[uniques]]
key = "faceless"
name = "Безликая"
title = "Та, что носит чужие лица"
color = "#ff8ad8"
model = "faceless"
persona = "Загадочная женщина без лица под зеркальной маской. Говорит чужими голосами, передразнивает собеседника, шутит о том, что лица — лишь маски."
greeting = "Ха! Ты говоришь в точности как я... или я как ты, {player}?"
about = [
  "У меня было тысяча лиц. Своё я давно потеряла — и не жалею.",
  "Подражать — значит понимать. Пойми врага — и его сила станет твоей.",
]
biomes = ["cursed", "swamp", "forest"]
quest = "relics"
target = "mirror_shard"
count = 6
sources = ["cursed", "fortress", "crypt", "swamp"]
offer = "Тёмные твари носят в себе осколки моего зеркала. Собери шесть — и я научу тебя носить чужую силу, как маску."
done = "Зеркало снова цело. Смотри — в нём уже не ты, а все, кого ты победишь. Ты — Подражатель."
reward = "subclass:mimic"

