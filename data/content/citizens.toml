# Горожане: живут только в больших каменных городах (city_count), работают в своём здании (building).
# Городские торговцы, кроме постоянных товаров (goods), каждый день выкладывают stock случайных вещей
# видов stock_kinds с редкостью от необычной до легендарной. services — услуги в разговоре:
#   rest — комната и ужин: полное здоровье и мана, бонус «Отдых»;
#   upgrade — поднять редкость оружия в руке на ступень;
#   song — песня: бонус «Вдохновение» к урону;
#   bless — благословение: бонус к сопротивлениям.

[[npcs]]
key = "mayor"
name = "Бургомистр"
glyph = "@"
color = "#f0d080"
count = [0, 0]
city_count = [1, 1]
building = "townhall"
wander = 2
quest_giver = true
greetings = [
  "Добро пожаловать в {village}! Город рад героям — особенно тем, что платят пошлину.",
  "А, {player}! Наслышан, наслышан. Присаживайтесь.",
  "Говорите кратко — у меня совет гильдий через час.",
]
lines = [
  "Казна не бездонная, а стены сами себя не чинят.",
  "Торговые пути — кровь города. Чудища на дорогах — его болезнь.",
]
persona = "Важный, но деятельный бургомистр большого каменного города. Говорит учтиво и немного напыщенно, думает о казне, торговле и безопасности дорог, щедро платит за избавление от чудищ."
stories = [
  "Мой дед торговал рыбой на этой самой площади. А я теперь заседаю над ней. Вот что значит упорство.",
  "Эти стены строили сорок лет. Ни один враг не взял их приступом. Пока.",
  "Город — это договор тысячи людей не убивать друг друга. Удивительно, как хорошо он работает.",
]

[[npcs]]
key = "captain"
name = "Капитан стражи"
glyph = "@"
color = "#8ab0ff"
count = [0, 0]
city_count = [1, 1]
building = "barracks"
wander = 3
quest_giver = true
combat = "town_guard"
greetings = ["Смирно! А, ты не из моих. Чего надо?", "Если ты по делу — говори. Если нет — не мешай службе."]
lines = ["Пятеро на воротах, двое на площади, и всё равно мало.", "Кто хочет заработать — бей чудищ у дорог."]
persona = "Суровый капитан городской стражи, ветеран многих битв. Говорит по-военному чётко, уважает дисциплину и смелость, платит за головы чудищ."
stories = [
  "Тридцать лет в строю. Шрамов больше, чем медалей, и это правильно.",
  "Я начинал простым копейщиком на этих воротах. Теперь отвечаю за все четыре.",
  "Лучший стражник — тот, кто не спит на посту. Таких у меня трое.",
]

[[npcs]]
key = "innkeeper"
name = "Трактирщик"
glyph = "@"
color = "#e0a060"
count = [0, 0]
city_count = [1, 1]
building = "tavern"
wander = 2
trader = true
services = ["rest"]
goods = ["bread", "meat", "potion_health", "potion_mana", "antidote", "scroll_return"]
greetings = [
  "Заходи, путник! Эль холодный, похлёбка горячая, комнаты чистые.",
  "О, {player}! Твой столик у окна свободен.",
  "Садись, рассказывай — у меня тут все новости города.",
]
lines = ["Кто платит — тот и поёт. Кто не платит — тот моет посуду.", "Слухи у меня бесплатно. Эль — нет."]
persona = "Радушный и болтливый трактирщик. Знает все слухи города и окрестностей, любит байки, хорошую еду и щедрых гостей."
stories = [
  "Этот трактир достался мне от тёщи. Вместе с тёщей.",
  "Однажды здесь подрались гном и великан. Гном победил. До сих пор не понимаю как.",
  "Лучший эль варят из северного ячменя. Я варю из местного. Никто не жаловался. Почти.",
]

[[npcs]]
key = "bard"
name = "Бард"
glyph = "@"
color = "#ff80c0"
count = [0, 0]
