services = ["song"]
greetings = ["О, новый слушатель! Песню? Балладу? Скабрёзную частушку?", "{player}! Я сложу о тебе песню. Если заплатишь."]
lines = ["Каждый подвиг достоин баллады. Даже маленький.", "Ла-ла... нет, не та нота."]
persona = "Весёлый странствующий бард с лютней. Говорит певуче, шутит, сочиняет на ходу стихи о собеседнике, знает старые легенды."
stories = [
  "Я пел при дворе Звёздного короля. Ну, при дворе его конюха. Но пел!",
  "Моя лютня пережила три пожара и одну очень злую публику.",
  "Лучшая песня — та, что спета вовремя. Например, перед битвой.",
]

