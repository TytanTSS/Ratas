# Классы. Подклассы, ветки, навыки и умения каждого класса — в skills/<класс>.toml,
# общие ветки «Выживание» и «Тайные знания» — в skills/common.toml.
#
# Класс прокачивается очками навыков, вложенными в его ветки: это и есть уровень класса.
# На 5-м уровне класса (поле level подкласса) можно выбрать один подкласс — его ветка откроется.
# Начать второй класс можно с 5-го уровня персонажа. Секретные классы и подклассы (secret = true)
# открываются только заданиями уникальных персонажей мира.
#
# equip у навыка — бонусы работают только с этим снаряжением; у умения — без него умение не применить:
# weapon — любое оружие, shield — щит, twohand_dual — двуручное оружие или по оружию в каждой руке, bow — лук или арбалет.

