# Сборка и запуск через mise: https://mise.jdx.dev
#   mise install          — поставить Rust нужной версии
#   mise run play         — собрать и запустить игру
#   mise tasks            — список всех задач

[tools]
rust = "1.97"

[tasks.build]
description = "Собрать игру (окно и сервер в одном файле)"
run = "cargo build --release -p ratas"

[tasks.build-server]
description = "Собрать выделенный сервер без графики"
run = "cargo build --release -p ratas --no-default-features"

[tasks.play]
description = "Играть; флаги после --, например: mise run play -- --new --seed 42"
run = "cargo run --release -p ratas --"

[tasks.server]
description = "Запустить выделенный сервер; флаги после --, например: mise run server -- --seed 7"
run = "cargo run --release -p ratas --no-default-features -- --server"

[tasks.test]
description = "Все тесты"
run = "cargo test --workspace"

[tasks.lint]
description = "Форматирование и clippy"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.check]
description = "Проверки перед коммитом"
depends = ["lint", "test"]
run = "true"

[tasks.shot]
description = "Скриншот графики без экрана (нужен xvfb-run); файл — SHOT"
run = 'RATAS_AUTOSHOT="${SHOT:-/tmp/ratas.png};8" xvfb-run -a -s "-screen 0 1280x800x24" cargo run --release -p ratas -- --new --seed 7 --class warrior'

[tasks.clean]
description = "Удалить собранные файлы"
run = "cargo clean && rm -rf dist"
