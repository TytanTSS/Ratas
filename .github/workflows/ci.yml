name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; rustup installs it on first use
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p ratas --no-default-features --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: server-only build
        run: cargo build -p ratas --no-default-features --locked
